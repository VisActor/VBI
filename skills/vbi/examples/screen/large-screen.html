<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>数字大屏 · 可视化业务全景 · VBI</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #031315;
        --cyan: #59c7c9;
        --orange: #f67c4e;
        --ink: #dcf1ed;
        --muted: #739495;
        --line: #1b4245;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font-family: 'Arial Narrow', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background-image:
          radial-gradient(ellipse at 50% 4%, #0b343938, transparent 64%),
          repeating-linear-gradient(120deg, transparent 0 260px, #0c373716 261px 263px, transparent 264px 520px);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 20% 65%, #0a515319, transparent 30%),
          radial-gradient(ellipse at 83% 15%, #0b43441c, transparent 25%);
      }
      button,
      select {
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
        color: #aac4c3;
        background: transparent;
        border: 1px solid #245054;
        border-radius: 0;
        padding: 5px 12px;
        font-size: 12px;
      }
      option {
        background: #082528;
      }
      button:hover,
      select:hover {
        color: #eafff9;
        border-color: var(--cyan);
      }
      button:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 4px;
      }
      fieldset {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0;
        padding: 0;
        border: 0;
      }
      fieldset:disabled {
        opacity: 0.5;
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      .shell {
        padding: 16px 20px 0;
        max-width: 2560px;
        margin: auto;
        position: relative;
      }
      .topbar {
        height: 88px;
        display: grid;
        grid-template-columns: 1fr 1.65fr 1fr;
        align-items: center;
        border-top: 1px solid #376061;
        border-bottom: 1px solid #244448;
        position: relative;
      }
      .topbar::before {
        content: '';
        position: absolute;
        height: 5px;
        top: -2px;
        left: 0;
        right: 0;
        background: radial-gradient(circle, #f183526b 2px, transparent 3px) left center / 8.3% 5px repeat-x;
      }
      .controls {
        justify-self: start;
        gap: 0;
      }
      .controls button,
      .controls select {
        padding: 5px 12px;
        border: 0;
        border-right: 1px solid #335150;
        font-size: clamp(10px, 0.8vw, 15px);
      }
      .controls select {
        padding-left: 0;
      }
      .controls button:last-child {
        border: 0;
      }
      .masthead {
        align-self: stretch;
        text-align: center;
        padding: 10px 0 8px;
        background: linear-gradient(0deg, #0d3f496e, #072c321c);
        clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%);
        border-bottom: 2px solid #408487;
      }
      h1 {
        font-size: clamp(25px, 2vw, 42px);
        font-weight: 650;
        letter-spacing: 0.07em;
        text-shadow: 0 0 24px #74dcd326;
        white-space: nowrap;
      }
      .masthead p {
        color: #66898c;
        font-size: 9px;
        letter-spacing: 0.48em;
        margin-top: 8px;
      }
      .clock {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .clock time {
        color: #b3cfcb;
        font-size: clamp(14px, 1.2vw, 25px);
        letter-spacing: -0.04em;
      }
      .clock span {
        color: #5e8080;
        margin-right: 18px;
      }
      .clock p {
        color: #587d80;
        font-size: 9px;
        letter-spacing: 0.15em;
        margin-top: 7px;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(26, minmax(0, 1fr));
        grid-template-rows: repeat(12, minmax(0, 1fr));
        gap: 18px;
        height: calc(100svh - 160px);
        min-height: 620px;
        margin-top: 26px;
      }
      .panel {
        position: relative;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: linear-gradient(145deg, #09202326, transparent 70%);
      }
      .panel::before,
      .panel::after {
        content: '';
        position: absolute;
        z-index: 2;
        inset: -2px auto auto -1px;
        width: 3px;
        height: 3px;
        background: #70b3af;
        box-shadow: 0 0 5px #45b9bb55;
      }
      .panel::after {
        inset: auto -1px -2px auto;
      }
      .panel-heading {
        height: 37px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
      }
      .panel-heading h2 {
        text-align: center;
        font-size: clamp(13px, 0.98vw, 20px);
        font-weight: 500;
        line-height: 32px;
        padding: 0 46px;
        min-width: 55%;
        background: linear-gradient(0deg, #10424c77, transparent);
        clip-path: polygon(0 0, 100% 0, 89% 100%, 11% 100%);
        border-bottom: 1px solid #2a6972;
        position: relative;
      }
      .panel-heading h2::after {
        content: '';
        position: absolute;
        inset: 0 13% 1px;
        border: 1px solid #285b65;
        border-top: 0;
        transform: skewX(-30deg);
        pointer-events: none;
      }
      .legend {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
        color: var(--muted);
        font-size: 10px;
        line-height: 15px;
        flex-shrink: 0;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend i {
        width: 7px;
        height: 7px;
        display: inline-block;
        background: var(--key, var(--cyan));
      }
      .legend .line-key {
        height: 2px;
        width: 14px;
        position: relative;
      }
      .line-key::after {
        content: '';
        position: absolute;
        left: 5px;
        top: -2px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: inherit;
      }
      .plot {
        min-height: 0;
        min-width: 0;
        flex: 1;
        position: relative;
      }
      .plot canvas {
        display: block;
      }
      .mirror-legend {
        justify-content: space-between;
        padding: 4px 22px 0;
      }
      .mirror {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
        padding: 14px 20px 8px;
        gap: 6px;
      }
      .mirror-labels {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        font-size: 11px;
        color: #8ba7a5;
        text-align: center;
        padding-bottom: 26px;
      }
      .ring-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 0 20px;
      }
      .ring-wrap .plot {
        height: 100%;
      }
      .ring-wrap::before {
        content: '';
        position: absolute;
        height: 98%;
        aspect-ratio: 1;
        top: 1%;
        left: 50%;
        transform: translateX(-50%);
        border: 1px solid #2b55574d;
        border-radius: 50%;
        box-shadow:
          inset 0 0 0 7px var(--bg),
          inset 0 0 0 8px #2b55573d;
        pointer-events: none;
      }
      .ring-copy {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        color: #bad7d2;
        font-size: clamp(10px, 0.78vw, 16px);
        line-height: 1.6;
      }
      .ring-copy span {
        display: block;
        color: #6c999a;
      }
      .ring-legend {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px 10px;
        padding: 0 22px 15px;
        font-size: 10px;
      }
      .ring-legend span {
        white-space: nowrap;
      }
      .ring-legend em {
        font-style: normal;
        color: #abc6c4;
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .ring-legend i {
        width: 5px;
        height: 5px;
        transform: rotate(45deg);
        background: transparent;
        border: 1px solid var(--key);
      }
      .users .plot {
        margin: 12px 16px 10px;
      }
      .axis-units {
        display: flex;
        justify-content: space-between;
        color: #597e7e;
        font-size: 9px;
        padding: 3px 20px 0;
      }
      .hero {
        padding: 0 18px 14px;
      }
      .hero .panel-heading {
        margin: 0;
      }
      .hero .panel-heading h2 {
        min-width: 28%;
      }
      .hero-frame {
        flex: 1;
        min-height: 140px;
        border: 1px solid #245a60;
        margin-top: 8px;
        padding: 26px 25px 18px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(160deg, #0a282c38, transparent 65%);
        position: relative;
        box-shadow: inset 0 0 25px #0a353427;
      }
      .hero-frame::before,
      .hero-frame::after {
        content: '';
        position: absolute;
        width: 70px;
        height: 10px;
        border-top: 2px solid #65b5b266;
        top: -1px;
        left: -1px;
      }
      .hero-frame::after {
        top: auto;
        left: auto;
        bottom: -1px;
        right: -1px;
        transform: rotate(180deg);
      }
      .hero-amount {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(0deg, #0a333c66, transparent);
        border-top: 1px solid #225459;
        box-shadow: inset 0 1px 7px #16495055;
        padding: 15px 0;
      }
      .hero-amount strong {
        font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(56px, min(8.5vw, 15vh), 190px);
        line-height: 1.1;
        font-weight: 500;
        font-stretch: condensed;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 32px #6de1d112;
        white-space: nowrap;
      }
      .hero-caption {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        margin-top: 21px;
        font-size: clamp(12px, 1vw, 19px);
        color: #abc5c3;
      }
      .hero-caption::before,
      .hero-caption::after {
        content: '';
        height: 1px;
        flex: 1;
        background: linear-gradient(90deg, transparent, #2a5e62);
      }
      .hero-caption::after {
        transform: rotate(180deg);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 21px 15px;
        padding: 23px 0 16px;
      }
      .metric {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 12px;
      }
      .metric-icon {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: clamp(34px, 3.2vw, 62px);
        aspect-ratio: 1;
        border: 1px solid #235864;
        border-radius: 50%;
        color: var(--cyan);
        background: radial-gradient(circle at 50% 30%, #0c2e33, #08262e77 60%);
        box-shadow: inset 0 0 9px #399da31c;
      }
      .metric-icon svg {
        width: 52%;
        height: 52%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.55;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .metric-copy {
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .metric-label {
        font-size: clamp(10px, 0.95vw, 19px);
        color: #739392;
        white-space: nowrap;
      }
      .metric strong {
        font-weight: 400;
        font-size: clamp(18px, 1.6vw, 33px);
        color: #d8e8e3;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.045em;
      }
      .metric small {
        color: #547777;
        font-size: 11px;
      }
      .penetration {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-top: 2px;
      }
      .penetration label {
        color: #7b9996;
        font-size: clamp(11px, 1vw, 20px);
        white-space: nowrap;
      }
      .progress-track {
        height: 17px;
        border: 1px solid #254341;
        padding: 4px;
        border-radius: 20px;
        flex: 1;
      }
      .progress-fill {
        height: 7px;
        width: var(--value, 0%);
        background: var(--orange);
        box-shadow: 0 0 10px #f67c4e22;
        border-radius: 9px 0 0 9px;
        position: relative;
      }
      .progress-fill::after {
        content: '';
        position: absolute;
        right: -2px;
        top: -3px;
        width: 5px;
        height: 13px;
        background: var(--orange);
      }
      .penetration strong {
        color: var(--orange);
        font-weight: 500;
        font-size: clamp(19px, 1.7vw, 34px);
        font-variant-numeric: tabular-nums;
      }
      .media {
        padding: 0 0 12px;
      }
      .media-frame {
        position: relative;
        flex: 1;
        min-height: 0;
        margin-top: 8px;
        overflow: hidden;
        background: #602d1c;
      }
      .media-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 43%;
        position: absolute;
        inset: 0;
      }
      .media-frame::after {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 1px #a0f0ed2b;
        pointer-events: none;
      }
      .live-tag {
        position: absolute;
        top: 13px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        background: #1a160c70;
        font-size: 10px;
        color: #fff5da;
        backdrop-filter: blur(8px);
      }
      .live-tag i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ffba79;
      }
      .media-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 28px 20px 20px;
        background: linear-gradient(0deg, #a52f16f0, #c64020dd 75%, transparent);
      }
      .media-caption small {
        letter-spacing: 0.24em;
        color: #ffd5ae;
        font-size: 10px;
      }
      .media-caption p {
        font-size: clamp(20px, 1.9vw, 39px);
        font-weight: 650;
        letter-spacing: 0.06em;
        margin: 6px 0;
        color: #fff0d3;
      }
      .media-caption span {
        color: #ffccb1;
        font-size: 10px;
      }
      .trend .panel-heading h2 {
        min-width: 28%;
      }
      .trend-tools {
        display: flex;
        justify-content: flex-end;
        padding: 1px 18px 0;
        position: absolute;
        right: 0;
        top: 14px;
        gap: 7px;
      }
      .trend-tools button {
        padding: 3px 12px;
        min-width: 66px;
        font-size: 10px;
        border-color: #284b4b;
        background: linear-gradient(0deg, #0b3339, transparent);
      }
      .trend-tools button[aria-pressed='true'] {
        background: linear-gradient(0deg, #79472d88, transparent);
        border-color: #93634388;
        color: #e8d4c7;
      }
      .trend .legend {
        margin-top: 6px;
      }
      .trend .plot {
        margin: 2px 20px 10px;
      }
      .ranking-list {
        list-style: none;
        margin: 0;
        padding: 2px 16px 11px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .ranking-list li {
        flex: 1;
        display: grid;
        grid-template-columns: 32px 42px minmax(40px, 0.7fr) minmax(35px, 1fr) minmax(50px, 0.85fr);
        gap: 7px;
        align-items: center;
        border-bottom: 1px dotted #1d3736;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        color: #8da9a6;
        min-height: 23px;
      }
      .ranking-list li:last-child {
        border: 0;
      }
      .rank {
        color: #547c7b;
      }
      .ranking-list li:first-child .rank {
        color: var(--orange);
      }
      .ranking-orders {
        color: #bed2ce;
        text-align: right;
      }
      .ranking-orders small {
        color: #527371;
        font-size: 8px;
        margin-left: 3px;
      }
      .ranking-value {
        color: #c4d8d1;
        text-align: right;
        font-size: 10px;
      }
      .rank-track {
        height: 2px;
        background: #143333;
      }
      .rank-fill {
        display: block;
        height: 2px;
        width: var(--value);
        background: var(--key);
        position: relative;
      }
      .rank-fill::after {
        content: '';
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--key);
        position: absolute;
        right: -2px;
        top: -1px;
      }
      .footer {
        height: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #4f7778;
        font-size: 9px;
        letter-spacing: 0.08em;
      }
      .footer #status::before {
        content: '';
        display: inline-block;
        margin-right: 6px;
        width: 4px;
        height: 4px;
        background: #5cb5a8;
        border-radius: 50%;
      }
      body[data-state='error'] #status {
        color: #ffac88;
      }
      .enter {
        opacity: 0;
      }
      body.revealed .enter {
        animation: enter 620ms cubic-bezier(0.2, 0.65, 0.2, 1) both;
        animation-delay: calc(var(--order, 0) * 85ms);
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(13px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (min-width: 2000px) {
        .shell {
          padding: 20px 24px 0;
        }
        .dashboard {
          margin-top: 30px;
          height: calc(100svh - 172px);
          gap: 22px;
        }
        .topbar {
          height: 92px;
        }
        .legend,
        .mirror-labels,
        .ring-legend {
          font-size: 12px;
        }
        .ranking-list li,
        .ranking-value {
          font-size: 12px;
        }
      }
      @media (max-width: 1400px) and (min-width: 1100px) {
        .shell {
          padding: 12px 12px 0;
        }
        .dashboard {
          gap: 12px;
          margin-top: 20px;
          height: calc(100svh - 142px);
        }
        .topbar {
          height: 80px;
        }
        .masthead p {
          letter-spacing: 0.2em;
          font-size: 8px;
        }
        .hero {
          padding-left: 12px;
          padding-right: 12px;
        }
        .hero-frame {
          padding: 18px 16px 14px;
        }
        .metrics {
          gap: 16px 10px;
        }
        .metric {
          gap: 7px;
        }
        .ring-legend {
          padding-left: 10px;
          padding-right: 10px;
          gap: 6px;
          font-size: 9px;
        }
        .trend-tools {
          top: 40px;
          padding-right: 12px;
        }
        .trend .legend {
          justify-content: flex-start;
          margin-left: 20px;
        }
        .ranking-list {
          padding: 0 9px 9px;
        }
        .ranking-list li {
          grid-template-columns: 26px 34px minmax(31px, 0.7fr) minmax(20px, 1fr) minmax(41px, 0.8fr);
          gap: 4px;
          font-size: 9px;
        }
        .ranking-value {
          font-size: 9px;
        }
      }
      @media (max-width: 1099px) {
        .shell {
          padding: 12px 14px 0;
        }
        .topbar {
          height: auto;
          grid-template-columns: 1fr 1fr;
          gap: 14px;
          padding-bottom: 12px;
        }
        .masthead {
          grid-column: 1/-1;
          grid-row: 1;
          padding: 15px 0;
        }
        h1 {
          font-size: clamp(21px, 3.6vw, 34px);
        }
        .masthead p {
          font-size: 8px;
          letter-spacing: 0.2em;
        }
        .controls button,
        .controls select {
          font-size: 10px;
          padding: 3px 8px;
        }
        .clock time {
          font-size: 14px;
        }
        .clock span {
          display: none;
        }
        .clock p {
          font-size: 8px;
        }
        .dashboard {
          grid-template-columns: repeat(12, minmax(0, 1fr));
          grid-template-rows: none;
          grid-auto-rows: 70px;
          height: auto;
          min-height: 0;
          gap: 16px;
          margin-top: 22px;
        }
        .panel-heading h2 {
          font-size: 16px;
        }
        .hero {
          padding: 0 12px 16px;
        }
        .hero-frame {
          margin-top: 6px;
          padding: 22px 16px 15px;
        }
        .hero-amount strong {
          font-size: clamp(45px, 8.8vw, 85px);
        }
        .hero-caption {
          font-size: 13px;
        }
        .metric {
          gap: 8px;
        }
        .metric-icon {
          width: 37px;
        }
        .metric-label {
          font-size: 11px;
        }
        .metric strong {
          font-size: 23px;
        }
        .metrics {
          gap: 20px 10px;
        }
        .penetration label {
          font-size: 12px;
        }

    <script src="https://cdn.jsdelivr.net/npm/@visactor/vchart@2.1.7/build/index.min.js"></script>
    <script type="module">
      import { VBI } from 'https://cdn.jsdelivr.net/npm/@visactor/vbi@latest/+esm'
      import { VQuery } from 'https://cdn.jsdelivr.net/npm/@visactor/vquery@latest/dist/browser/esm/browser.js/+esm'
      import { Builder, registerAll } from 'https://cdn.jsdelivr.net/npm/@visactor/vseed@latest/+esm'
      const VChart = window.VChart.default

      registerAll()
      const $ = (selector) => document.querySelector(selector)
      const number = (value, digits = 0) =>
        new Intl.NumberFormat('zh-CN', { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(value)
      const instances = new Map()
      const connectorId = 'vbi-example-large-screen'
      const palette = ['#53c2c5', '#3193ad', '#c4d9d2', '#e0c36d', '#dd8c40', '#c44d35']
      const motion = matchMedia('(prefers-reduced-motion: reduce)')
      const aliases = {
        date: '日期',
        category: '直播类型',
        incomeType: '收入类型',
        source: '用户来源',
        product: '商品',
        sales: '消费金额',
        orders: '消费人次',
        viewers: '观看人次',
        sessions: '直播场次',
        hosts: '主播出场人次',
        fans: '新增粉丝',
        watchMinutes: '观看分钟',
        conversion: '平均转化率',
      }
      const iconPaths = {
        orders:
          '<circle cx="13" cy="8" r="6"/><path d="M10 16c-5 1-7 5-7 9m12-5h9v6h-9z"/><path stroke="#f67c4e" d="M18 23h3"/>',
        sessions: '<path d="M2 6h16v17H2zM18 12l8-5v15l-8-5z"/><path stroke="#f67c4e" d="m7 11 6 4-6 4z"/>',
        hosts:
          '<circle cx="12" cy="8" r="6"/><path d="M10 17c-5 1-7 4-7 9"/><circle cx="21" cy="22" r="4" stroke="#f67c4e"/>',
        viewers:
          '<circle cx="12" cy="8" r="6"/><path d="M10 17c-5 1-7 4-7 9"/><path stroke="#f67c4e" d="M15 22q6-8 12 0-6 8-12 0Z"/><circle cx="21" cy="22" r="1" stroke="#f67c4e"/>',
        fans: '<circle cx="12" cy="8" r="6"/><path d="M10 17c-5 1-7 4-7 9"/><path stroke="#f67c4e" d="M16 21c0-5 5-4 5-2 2-4 7-1 4 3l-4 4z"/>',
        duration: '<circle cx="14" cy="14" r="11"/><path stroke="#f67c4e" d="M14 7v8h6"/>',
      }
      const metrics = [
        ['orders', '消费人次', '人次'],
        ['sessions', '直播场次', '场'],
        ['hosts', '主播出场', '人次'],
        ['viewers', '观看人次', '人次'],
        ['fans', '新增粉丝', '人'],
        ['duration', '人均观看', '分'],
      ]
      $('#metrics').innerHTML = metrics
        .map(
          ([id, label, unit], i) =>
            `<div class="metric enter" style="--order:${10 + i}"><span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 28 28">${iconPaths[id]}</svg></span><div class="metric-copy"><span class="metric-label">${label}:</span><strong id="${id}">0</strong><small>${unit}</small></div></div>`,
        )
        .join('')
      function updateClock() {
        const now = new Date()
        $('#clock').dateTime = now.toISOString()
        $('#clock').innerHTML =
          `<span>${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}</span>${now.toLocaleTimeString('zh-CN', { hour12: false })}`
      }
      updateClock()
      setInterval(updateClock, 1000)

      // 确定性模拟数据。聚合、排序与筛选全部交给 VBI → VQuery。
      async function connectDemo() {
        const rawDataset = []
        const regions = ['华东', '华南', '华北', '西南']
        const channels = ['线上商城', '线下门店', '合作伙伴']
        const categories = ['才艺分享', '健身塑形', '商品带货', '新闻纪实']
        const incomeTypes = ['景区', '酒店', '餐饮', '水产品', '农产品', '文创']
        const sources = ['个人主页', '关注', '其他', '商业化', '视频', '同城', '直播推荐']
        const products = ['手机', '电视', '平板', '电脑', '螺蛳粉', '火鸡面', '防晒霜']
        const pick = (items, thresholds, slot) => items[thresholds.findIndex((limit) => slot < limit)]
        for (let day = 1; day <= 30; day++) {
          regions.forEach((region, r) =>
            channels.forEach((channel, c) => {
              const orders = Math.round(16 + day * 0.7 + (3 - r) * 9 + (2 - c) * 5 + Math.sin(day * 0.6 + r) * 8)
              const sales = orders * (145 + r * 19 + c * 26)
              const slot = (day * 17 + r * 7 + c * 13) % 100
              const rate = Math.max(0.12, 0.38 + 0.22 * Math.sin(day * 0.9) + 0.09 * Math.cos(day * 1.7) + r * 0.018)
              const viewers = Math.round(orders / rate)
              rawDataset.push({
                day,
                date: `09/${String(day).padStart(2, '0')}`,
                region,
                channel,
                category: pick(categories, [44, 59, 92, 100], slot),
                incomeType: pick(incomeTypes, [40, 68, 82, 91, 97, 100], (slot + 29) % 100),
                source: pick(sources, [21, 36, 60, 73, 85, 93, 100], (slot + 11) % 100),
                product: pick(products, [26, 47, 63, 77, 87, 95, 100], (slot + 43) % 100),
                sales,
                orders,
                viewers,
                sessions: 1 + ((day + r + c) % 3),
                hosts: 2 + ((day + r) % 4),
                fans: Math.round(viewers * (0.16 + c * 0.035)),
                watchMinutes: Math.round(viewers * (6.2 + c * 1.3 + Math.sin(day) * 2)),
                conversion: orders / viewers,
              })
            }),
          )
        }
        const schema = Object.keys(rawDataset[0]).map((name) => ({
          name,
          type: typeof rawDataset[0][name] === 'number' ? 'number' : 'string',
        }))
        const query = new VQuery()
        const source = { type: 'json', rawDataset }
        if (await query.hasDataset(connectorId)) await query.updateDatasetSource(connectorId, schema, source)
        else await query.createDataset(connectorId, schema, source)
        VBI.connectors.register(connectorId, {
          discoverSchema: async () => schema,
          query: async ({ queryDSL }) => {
            const dataset = await query.connectDataset(connectorId)
            try {
              return await dataset.query(queryDSL)
            } finally {
              await dataset.disconnect()
            }
          },
        })
      }
      function createChart(type, dimension, measures) {
        const chart = VBI.chart.create(VBI.chart.createEmpty(connectorId))
        chart.chartType.changeChartType(type)
        chart.theme.setTheme('dark')
        if (dimension)
          chart.dimensions.add(dimension, (node) => {
            node.setAlias(aliases[dimension])
            if (dimension === 'date') node.setSort({ order: 'asc' })
          })
        measures.forEach((field, index) =>
          chart.measures.add(field, (node) => {
            node
              .setAlias(aliases[field])
              .setAggregate({ func: field === 'conversion' ? 'avg' : 'sum' })
              .setFormat({
                type: field === 'conversion' ? 'percent' : 'number',
                fractionDigits: field === 'conversion' ? 1 : 0,
              })
            if (type === 'dualAxis') node.setEncoding(index === 0 ? 'primaryYAxis' : 'secondaryYAxis')
            if (['product', 'incomeType'].includes(dimension) && field === 'sales') node.setSort({ order: 'desc' })
            if (dimension === 'category' && field === 'sessions') node.setSort({ order: 'desc' })
          }),
        )
        return chart
      }
      function rowsOf(chart, seed) {
        const dsl = chart.build()
        return seed.dataset.map((row) =>
          Object.fromEntries([...dsl.dimensions, ...dsl.measures].map((field) => [field.field, row[field.id]])),
        )
      }
      const axis = {
        label: { labelColor: '#698c8c', labelFontSize: 10 },
        title: { visible: false },
        tick: { visible: false },
        line: { visible: false },
        grid: { visible: true, gridColor: '#244143', gridLineDash: [2, 4] },
      }
      function styled(seed) {
        return {
          ...seed,
          backgroundColor: 'transparent',
          color: { colorScheme: palette },
          label: { enable: false },
          legend: { enable: false },
          xAxis: { ...axis, grid: { visible: false } },
          yAxis: axis,
          primaryYAxis: axis,
          secondaryYAxis: axis,
          pointStyle: { pointVisible: false },
          lineStyle: { lineSmooth: true, lineWidth: 2 },
        }
      }
      function gradient(color, horizontal = false) {
        return {
          gradient: 'linear',
          x0: 0,
          y0: 0,
          x1: horizontal ? 1 : 0,
          y1: horizontal ? 0 : 1,
          stops: [
            { offset: 0, color: horizontal ? `${color}10` : `${color}ff` },
            { offset: 0.45, color: `${color}80` },
            { offset: 1, color: horizontal ? `${color}ff` : `${color}18` },
          ],
        }
      }
      function mount(spec, selector) {
        const element = $(selector)
        instances.get(element)?.release()
        spec.animation = false
        spec.padding = 0
        const chart = new VChart(spec, { dom: element })
        chart.renderSync()
        instances.set(element, chart)
      }
      function drawSocial(seed) {
        for (const [index, selector, color] of [
          [0, '#social-sessions', '#f67c4e'],
          [1, '#social-sales', '#59c7c9'],
        ]) {
          const input = styled(seed)
          input.measures = [seed.measures[index]]
          input.xAxis = { ...axis, inverse: index === 0 }
          input.yAxis = { visible: false }
          const spec = Builder.from(input).build()
          spec.barMaxWidth = 17
          spec.bar.style = {
            ...spec.bar.style,
            fill: gradient(color, true),
            stroke: `${color}80`,
            lineWidth: 0.6,
            cornerRadius: 0,
          }
          spec.axes.find((item) => item.orient === 'bottom').label.formatMethod = (value) =>
            number(Number(value) / (index === 1 ? 10000 : 1))
          mount(spec, selector)
        }
        $('#social-labels').replaceChildren(
          ...seed.dataset.map((row) =>
            Object.assign(document.createElement('span'), { textContent: row[seed.dimensions[0].id] }),
          ),
        )
      }
      function drawIncome(seed) {
        const rings = seed.measures.map((measure, index) => {
          const spec = Builder.from({ ...styled(seed), measures: [measure] }).build()
          return {
            ...spec,
            id: `income-ring-${index}`,
            data: { ...spec.data, id: `income-ring-${index}` },
            outerRadius: index === 0 ? 0.94 : 0.69,
            innerRadius: index === 0 ? 0.82 : 0.55,
            padAngle: 3,
            startAngle: -90,
            endAngle: 270,
            pie: { style: { stroke: '#031315', lineWidth: 2 }, state: { hover: { fillOpacity: 0.8 } } },
          }
        })
        mount(
          {
            type: 'common',
            background: 'transparent',
            color: rings[0].color,
            series: rings,
            legends: { visible: false },
            region: [{ clip: false }],
            tooltip: rings[0].tooltip,
          },
          '#income-plot',
        )
        $('#income-legend').innerHTML = seed.dataset
          .map(
            (row, i) =>
              `<span style="--key:${palette[i % palette.length]}"><i></i>${row[seed.dimensions[0].id]}<em>${number(row[seed.measures[0].id] / 10000, 1)}万</em></span>`,
          )
          .join('')
      }
      function drawDual(seed, selector, trend = false) {
        const spec = Builder.from(styled(seed)).build()
        spec.series.forEach((series) => {
          series.animation = false
          if (series.type === 'bar') {
            series.barMaxWidth = trend ? 12 : 18
            series.bar.style = { ...series.bar.style, fill: gradient('#59c7c9'), stroke: '#74d3d170', lineWidth: 0.6 }
          } else {
            series.line.style = {
              ...series.line.style,
              curveType: 'monotone',
              lineWidth: 2,
              stroke: (datum) => (trend || datum[series.seriesField] === seed.measures[2]?.id ? '#f67c4e' : '#59c7c9'),
            }
            series.point = { visible: false }
          }
        })
        const left = spec.axes.find((item) => item.orient === 'left')
        const right = spec.axes.find((item) => item.orient === 'right')
        left.label.formatMethod = (value) => number(Number(value) / (trend ? 1 : 10000), trend ? 0 : 0)
        right.label.formatMethod = (value) => number(Number(value) * (trend ? 100 : 0.001), trend ? 0 : 1)
        right.grid = { visible: false }
        if (trend) {
          right.min = 0
          right.max = 1
        }
        spec.axes.find((item) => item.orient === 'bottom').label.style.fontSize = trend ? 9 : 10
        mount(spec, selector)
      }
      function fillRanking(rows) {
        const largest = rows[0]?.sales || 1
        $('#ranking-list').innerHTML = rows
          .slice(0, 7)
          .map(
            (row, i) =>
              `<li class="enter" style="--order:${19 + i};--key:${i === 0 ? '#f67c4e' : i < 3 ? '#59c7c9' : '#8ba8a3'}"><span class="rank">No.${i + 1}</span><span>${row.product}</span><span class="ranking-orders">${number(row.orders)}<small>人次</small></span><span class="rank-track"><i class="rank-fill" style="--value:${(row.sales / largest) * 100}%"></i></span><span class="ranking-value">${number(row.sales)}</span></li>`,
          )
          .join('')
        if (document.body.classList.contains('revealed'))
          $('#ranking-list')
            .querySelectorAll('.enter')
            .forEach((element) => element.classList.remove('enter'))
      }
      function setValue(id, value, digits = 0, suffix = '') {
        const element = $(`#${id}`)
        element.dataset.value = value
        element.textContent = number(value, digits) + suffix
      }
      function fillTotals(total) {
        setValue('sales', total.sales, 2)
        metrics.forEach(([field]) =>
          setValue(
            field,
            field === 'duration' ? total.watchMinutes / total.viewers : total[field],
            field === 'duration' ? 2 : 0,
          ),
        )
        const ratio = (total.orders / total.viewers) * 100
        setValue('penetration-value', ratio, 2, '%')
        $('#penetration-meter').setAttribute('aria-valuenow', ratio.toFixed(2))
        $('#penetration-fill').style.setProperty('--value', `${ratio}%`)
      }
      function download(value) {
        const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 2)], { type: 'application/json' }))
        Object.assign(document.createElement('a'), { href: url, download: 'large-screen-dashboard.json' }).click()
        setTimeout(() => URL.revokeObjectURL(url), 1000)
      }
      async function run(task) {
        document.querySelectorAll('fieldset').forEach((fieldset) => {
          fieldset.disabled = true
        })
        document.body.dataset.state = 'loading'
        $('#status').textContent = '正在加载数据…'
        try {
          await task()
          document.body.dataset.state = 'ready'
          $('#status').textContent = `${$('#region').value || '全部地区'} · 2026 年 9 月模拟数据`
        } catch (error) {
          document.body.dataset.state = 'error'
          $('#status').textContent = `加载失败：${error.message}`
          console.error(error)
        } finally {
          document.querySelectorAll('fieldset').forEach((fieldset) => {
            fieldset.disabled = false
          })
        }
      }
      await run(async () => {
        await connectDemo()
        const dashboard = VBI.dashboard.create({
          ...VBI.dashboard.createEmpty(),
          breakpoints: { ...VBI.dashboard.createEmpty().breakpoints, lg: 1100 },
          meta: { title: '数字大屏：可视化业务全景', theme: 'dark' },
        })
        const charts = {
          social: createChart('bar', 'category', ['sessions', 'sales']),
          income: createChart('donut', 'incomeType', ['sales', 'orders']),
          users: createChart('dualAxis', 'source', ['sales', 'viewers', 'orders']),
          summary: createChart('table', null, [
            'sales',
            'orders',
            'sessions',
            'hosts',
            'viewers',
            'fans',
            'watchMinutes',
          ]),
          trend: createChart('dualAxis', 'date', ['viewers', 'conversion']),
          ranking: createChart('table', 'product', ['sales', 'orders']),
        }
        const insight = VBI.insight
          .create(VBI.insight.createEmpty())
          .setContent('![AI 生成的直播场景示意](./assets/large-screen-live-preview.png)\n\n品牌直播间 · 非实时直播')
        const definitions = [
          ['social', [0, 0, 6, 4], [0, 7, 12, 4]],
          ['income', [0, 4, 6, 4], [0, 11, 12, 4]],
          ['users', [0, 8, 6, 4], [0, 15, 12, 4]],
          ['summary', [6, 0, 14, 8], [0, 0, 12, 7]],
          ['trend', [6, 8, 14, 4], [0, 19, 12, 4]],
          ['media', [20, 0, 6, 8], [0, 23, 12, 7]],
          ['ranking', [20, 8, 6, 4], [0, 30, 12, 4]],
        ]
        definitions.forEach(([id, lg, xs]) => {
          const panel = $(`#${id}`)
          const box = ([x, y, w, h]) => ({ x, y, w, h })
          const collection = id === 'media' ? dashboard.insight : dashboard.chart
          collection.add((widget) => {
            if (id === 'media') widget.setInsightId(insight)
            else widget.setChart(charts[id])
            widget.setTitle(panel.querySelector('h2').textContent).setLayouts({ lg: box(lg), xs: box(xs) })
            panel.dataset.widget = widget.getId()
          })
        })
        function layout() {
          const dsl = dashboard.build()
          const breakpoint = innerWidth >= dsl.breakpoints.lg ? 'lg' : 'xs'
          for (const item of dsl.layout[breakpoint]) {
            const panel = document.querySelector(`[data-widget="${item.widgetId}"]`)
            panel.style.gridColumn = `${item.x + 1} / span ${item.w}`
            panel.style.gridRow = `${item.y + 1} / span ${item.h}`
          }
          instances.forEach((chart, element) => chart.resize(element.clientWidth, element.clientHeight))
        }
        let days = 30
        function filterChart(chart, isTrend = false) {
          chart.whereFilter.clear()
          if ($('#region').value)
            chart.whereFilter.add('region', (node) => node.setOperator('eq').setValue($('#region').value))
          if (isTrend && days === 7) chart.whereFilter.add('day', (node) => node.setOperator('gte').setValue(24))
        }
        async function renderTrend() {
          filterChart(charts.trend, true)
          drawDual(await charts.trend.buildVSeed(), '#trend-plot', true)
          document
            .querySelectorAll('[data-days]')
            .forEach((button) => button.setAttribute('aria-pressed', String(Number(button.dataset.days) === days)))
        }
        async function render() {
          Object.values(charts).forEach((chart) => filterChart(chart))
          layout()
          const seeds = Object.fromEntries(
            await Promise.all(
              Object.entries(charts)
                .filter(([id]) => id !== 'trend')
                .map(async ([id, chart]) => [id, await chart.buildVSeed()]),
            ),
          )
          fillTotals(rowsOf(charts.summary, seeds.summary)[0])
          drawSocial(seeds.social)
          drawIncome(seeds.income)
          drawDual(seeds.users, '#users-plot')
          fillRanking(rowsOf(charts.ranking, seeds.ranking))
          await renderTrend()
        }
        $('#region').addEventListener('change', () => run(render))
        document.querySelectorAll('[data-days]').forEach((button) =>
          button.addEventListener('click', () =>
            run(async () => {
              days = Number(button.dataset.days)
              await renderTrend()
            }),
          ),
        )
        $('#export').addEventListener('click', () =>
          download({ dashboard: dashboard.build(), resources: VBI.resources.snapshot() }),
        )
        $('#fullscreen').addEventListener('click', async () => {
          try {
            if (document.fullscreenElement) await document.exitFullscreen()
            else await document.documentElement.requestFullscreen()
          } catch {
            $('#status').textContent = '当前浏览器不支持全屏，请使用浏览器全屏功能。'
          }
        })
        document.addEventListener('fullscreenchange', () => {
          $('#fullscreen').textContent = document.fullscreenElement ? '退出全屏' : '进入全屏'
        })
        let resizeFrame
        window.addEventListener('resize', () => {
          cancelAnimationFrame(resizeFrame)
          resizeFrame = requestAnimationFrame(layout)
        })
        await render()
        requestAnimationFrame(() => document.body.classList.add('revealed'))
        // 减少动态效果时由 CSS 直接显示；切换筛选不重播组件入场。
        motion.addEventListener('change', () => {
          if (motion.matches)
            document
              .querySelectorAll('.enter')
              .forEach((element) => element.getAnimations().forEach((animation) => animation.finish()))
        })
      })
    </script>
  </body>
</html>
