<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>经营概览 · VBI 模板</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #28333e;
        --muted: #64717e;
        --accent: #a8c7e8;
        --background-start: #dce5f1;
        --up: #12815e;
        --down: #c64a3f;
      }
      body {
        isolation: isolate;
        margin: 0;
        min-height: 100svh;
        color: var(--ink);
        background: #f0f2f5;
        font-family: Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 12% 20%, var(--background-start), transparent 65%),
          radial-gradient(ellipse at 90% 80%, #ddd6ed90, transparent 65%),
          linear-gradient(135deg, transparent 25%, #ffffff90 48%, transparent 65%);
      }
      h1,
      h2,
      p,
      figure {
        margin: 0;
      }
      .shell {
        max-width: 1140px;
        margin: auto;
        padding: 32px 28px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 40px;
        font-size: 13px;
        align-items: center;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 650;
      }
      .muted,
      .comparison,
      .scope,
      footer {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: start;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 24px;
      }
      #filters {
        margin-left: auto;
        gap: 12px;
      }
      h1 {
        font-size: 27px;
        font-weight: 650;
        letter-spacing: -0.035em;
      }
      .heading p {
        margin-top: 10px;
      }
      fieldset {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        border: 0;
        margin: 0;
        padding: 0;
      }
      button {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
      }
      .segment {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 3px;
        padding: 3px;
        border-radius: 20px;
        background: #edf1f4;
      }
      .segment button {
        padding: 7px 12px;
        border-radius: 17px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
      }
      .segment button[aria-pressed='true'] {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 2px 5px #2436440a;
      }
      .segment button:hover {
        color: var(--ink);
        background: #ffffff80;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid #6c8eb5;
        outline-offset: 4px;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: minmax(44px, auto);
        gap: 18px;
      }
      .card {
        min-width: 0;
        padding: 24px;
        border-radius: 26px;
        background: #fbfdff;
        box-shadow: 0 18px 38px -22px #28394826;
        height: 100%;
      }
      .card-slot {
        min-width: 0;
        grid-column: 1 / -1;
      }
      /* 首屏状态由静态 HTML 声明；保留子内容的布局尺寸，供图表在展示前绘制。 */
      body[data-initialized='false'] #dashboard-content {
        height: 0;
        overflow: hidden;
        visibility: hidden;
      }
      body[data-initialized='false'] footer {
        margin-top: 0;
        padding: 24px;
        border-radius: 24px;
        background: #ffffff80;
      }
      body[data-state='error'] #status {
        color: var(--down);
      }
      .metric-card {
        transform: perspective(800px) rotate3d(var(--tilt-x, 0), var(--tilt-y, 1), 0, var(--tilt-angle, 0deg));
      }
      body[data-entrance='pending'] [data-enter] {
        opacity: 0;
      }
      .card h2 {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .insight {
        display: grid;
        gap: 8px;
        padding: 20px 24px;
      }
      .insight h2 {
        color: #6c8eb5;
      }
      #conclusion {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.6;
      }
      #evidence {
        display: grid;
        gap: 4px;
        margin: 0;
        padding-left: 20px;
        font-size: 13px;
        line-height: 1.65;
      }
      .hero {
        display: flex;
        flex-direction: column;
        padding: 26px 28px;
        min-height: 540px;
      }
      .small-body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .metric {
        display: block;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 1.12;
      }
      .hero-value {
        margin: 18px 0 10px;
        font-size: clamp(38px, 4.4vw, 59px);
        overflow-wrap: anywhere;
      }
      .small-value {
        margin: 18px 0 10px;
        font-size: 29px;
        overflow-wrap: anywhere;
      }
      .change[data-direction='up'] {
        color: var(--up);
      }
      .change[data-direction='down'] {
        color: var(--down);
      }
      .hero-figure {
        margin-top: 24px;
        flex: 1;
        min-height: 220px;
        position: relative;
      }
      #trend {
        position: absolute;
        inset: 0 0 24px;
        width: 100%;
      }
      #trend-empty {
        padding: 70px 0;
        text-align: center;
      }
      .dates {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: var(--muted);
        font-size: 11px;
        position: absolute;
        bottom: 0;
        width: 100%;
      }
      .hero-bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        border-top: 1px solid #e9eef2;
        padding-top: 24px;
        margin-top: 24px;
      }
      .hero-bottom > div + div {
        padding-left: 24px;
        border-left: 1px solid #e9eef2;
      }
      .hero-bottom strong {
        display: block;
        margin-top: 6px;
        font-size: 24px;
        font-weight: 600;
      }
      .mini {
        width: 116px;
        height: 77px;
        flex-shrink: 0;
      }
      .small-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .small-card .small-value {
        margin: 8px 0;
      }
      .ring {
        position: relative;
        width: 90px;
        height: 90px;
        flex-shrink: 0;
      }
      #consumer-ring-plot {
        width: 100%;
        height: 100%;
      }
      #consumer-share {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        font-size: 18px;
      }
      #consumer-share::after {
        content: '消费者';
        font-size: 10px;
        color: var(--muted);
      }
      .plot:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: 8px;
      }
      .date-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .date-controls button {
        padding: 4px 8px;
        border-radius: 10px;
        color: var(--muted);
        background: #edf1f4;
        font-size: 11px;
      }
      .small-note {
        margin-top: 24px;
      }
      details {
        margin-top: 20px;
        padding: 20px 24px;
        border-radius: 24px;
        background: #ffffff80;
      }
      summary {
        cursor: pointer;
        font-size: 13px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 12px 8px;
        border-bottom: 1px solid #e5eaee;
        text-align: right;
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      footer {
        margin-top: 24px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 600px) {
        .shell {
          padding: 24px 16px;
        }
        .topbar {
          margin-bottom: 28px;
        }
        .card {
          padding: 20px;
          border-radius: 18px;
        }
        .heading {
          gap: 14px;
        }
        .hero-bottom {
          gap: 12px;
        }
        .hero-bottom > div + div {
          padding-left: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .metric-card {
          transform: none !important;
        }
      }
      @media (hover: none), (pointer: coarse) {
        .metric-card {
          transform: none;
        }
      }
    </style>
  </head>
  <body data-state="loading" data-initialized="false" data-entrance="pending">
    <div class="shell">
      <div class="topbar">
        <span class="brand">Brand</span>
      </div>
      <header class="heading">
        <div>
          <h1>经营概览</h1>
          <p id="scope" class="scope">正在准备数据…</p>
        </div>
        <fieldset id="filters" disabled aria-label="全局筛选">
          <div class="segment" role="group" aria-label="地区">
            <button type="button" data-region="" aria-pressed="true">全部地区</button>
            <button type="button" data-region="华东" aria-pressed="false">华东</button>
            <button type="button" data-region="华北" aria-pressed="false">华北</button>
          </div>
          <div class="segment" role="group" aria-label="统计周期">
            <button type="button" data-days="7" aria-pressed="false">7 天</button>
            <button type="button" data-days="14" aria-pressed="false">14 天</button>
            <button type="button" data-days="30" aria-pressed="true">30 天</button>
          </div>
        </fieldset>
      </header>
      <div id="dashboard-content" inert>
        <main id="dashboard" class="dashboard" aria-busy="true">
          <div id="insight-slot" class="card-slot" data-enter="1">
            <section id="insight-card" class="card insight" aria-labelledby="insight-title">
              <h2 id="insight-title">核心发现</h2>
              <p id="conclusion">正在分析…</p>
              <p id="insight-scope" class="scope"></p>
              <ul id="evidence"></ul>
            </section>
          </div>
          <div id="hero-slot" class="card-slot" data-enter="2">
            <section id="hero-card" class="card hero" aria-labelledby="sales-title">
              <h2 id="sales-title">销售总额</h2>
              <strong id="sales" class="metric hero-value">—</strong>
              <p class="comparison">
                <span id="sales-change" class="change">—</span> · <span class="compare-label"></span>
              </p>
              <figure class="hero-figure">
                <div
                  id="trend"
                  class="plot"
                  tabindex="0"
                  role="img"
                  aria-label="每日销售额；悬停联动全部指标，左右键逐日查看，Esc 恢复汇总"
                ></div>
                <p id="trend-empty" class="muted" hidden>当前范围暂无订单</p>
                <figcaption id="dates" class="dates"></figcaption>
              </figure>
              <fieldset class="date-controls" disabled aria-label="逐日查看">
                <p id="hover-scope" class="muted">区间汇总 · 悬停查看当日</p>
                <button type="button" data-date-step="-1" aria-label="查看前一天">← 前一天</button>
                <button type="button" data-date-step="1" aria-label="查看后一天">后一天 →</button>
                <button type="button" id="restore-metrics">区间汇总</button>
              </fieldset>
              <div class="hero-bottom">
                <div>
                  <p class="muted">综合利润率</p>
                  <strong id="margin" class="metric">—</strong>
                </div>
                <div>
                  <p class="muted">平均客单价</p>
                  <strong id="average" class="metric">—</strong>
                </div>
              </div>
            </section>
          </div>
          <div id="growth-slot" class="card-slot" data-enter="3">
            <section id="growth-card" class="card metric-card small-card" aria-labelledby="growth-title">
              <h2 id="growth-title">销售增长</h2>
              <div class="small-body">
                <strong id="growth" class="metric small-value change">—</strong>
                <div
                  id="growth-trend"
                  class="mini plot"
                  tabindex="0"
                  role="img"
                  aria-label="每日销售走势；悬停或左右键仅联动增长卡，Esc 恢复汇总"
                ></div>
              </div>
              <p class="comparison"><span class="compare-label"></span></p>
            </section>
          </div>
          <div id="orders-slot" class="card-slot" data-enter="4">
            <section id="orders-card" class="card metric-card small-card" aria-labelledby="orders-title">
              <h2 id="orders-title">订单总数</h2>
              <div class="small-body">
                <strong id="orders" class="metric small-value">—</strong>
                <div class="ring" role="group" aria-label="消费者订单占比">
                  <div id="consumer-ring-plot" role="img" aria-label="消费者与其他客户的去重订单占比"></div>
                  <span id="consumer-share">—</span>
                </div>
              </div>
              <p class="comparison">
                <span id="orders-change" class="change">—</span> · <span class="compare-label"></span>
              </p>
            </section>
          </div>
          <div id="profit-slot" class="card-slot" data-enter="5">
            <section id="profit-card" class="card metric-card small-card" aria-labelledby="profit-title">
              <h2 id="profit-title">利润</h2>
              <div class="small-body">
                <strong id="profit" class="metric small-value">—</strong>
                <div
                  id="profit-trend"
                  class="mini plot"
                  tabindex="0"
                  role="img"
                  aria-label="每日利润；红色柱为亏损，悬停或左右键仅联动利润卡，Esc 恢复汇总"
                ></div>
              </div>
              <p class="comparison">
                <span id="profit-change" class="change">—</span> · <span class="compare-label"></span>
              </p>
            </section>
          </div>
        </main>
        <details open data-enter="6">
          <summary>查看区域明细与数据口径</summary>
          <div class="table-wrap">
            <table>
              <caption class="muted">
                销售额和利润求和，订单 ID 去重；消费者占比按去重订单计算。比较此前等长周期，悬停比较前一天。
              </caption>
              <thead>
                <tr>
                  <th scope="col">地区</th>
                  <th scope="col">销售额</th>
                  <th scope="col">订单数</th>
                  <th scope="col">利润率</th>
                </tr>
              </thead>
              <tbody id="regions"></tbody>
            </table>
          </div>
        </details>
      </div>
      <footer><p id="status" role="status">正在加载模块…</p></footer>
    </div>
    <noscript>请启用 JavaScript 以查询和绘制图表。</noscript>
    <script src="https://cdn.jsdelivr.net/npm/@visactor/vchart@2.1.7/build/index.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "https://cdn.jsdelivr.net/npm/@visactor/vchart@2.1.7/+esm": "data:text/javascript,export default globalThis.VChart.default;export const StreamLight=globalThis.VChart.StreamLight;"
        }
      }
    </script>
    <script type="module">
      const $ = (selector) => document.querySelector(selector)
      const grid = $('#dashboard')
      const instances = new Map()
      let observer,
        disposed = false
      const subscriptions = []
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
      const finePointer = matchMedia('(hover: hover) and (pointer: fine)')
      const metricAnimations = new Map()
      let entrances = [],
        hasEntered = false
      function finishEntrance() {
        document.body.dataset.entrance = 'complete'
        entrances.forEach((animation) => animation.cancel())
        entrances = []
      }
      function revealComponents() {
        if (hasEntered) return
        hasEntered = true
        if (reducedMotion.matches) return finishEntrance()
        document.body.dataset.entrance = 'playing'
        entrances = [...document.querySelectorAll('[data-enter]')].map((element) =>
          element.animate(
            [
              { opacity: 0, transform: 'translateY(10px)' },
              { opacity: 1, transform: 'translateY(0)' },
            ],
            {
              duration: 1400,
              delay: Number(element.dataset.enter) * 420,
              easing: 'cubic-bezier(.2,.75,.25,1)',
              fill: 'both',
            },
          ),
        )
        Promise.all(entrances.map((animation) => animation.finished.catch(() => {}))).then(finishEntrance)
      }
      function animateMetric(selector, target, format = String, emptyText = '—') {
        const element = $(selector)
        const previous = metricAnimations.get(element)
        if (previous && previous.target === target) return
        if (previous) cancelAnimationFrame(previous.frame)
        if (!Number.isFinite(target)) {
          metricAnimations.delete(element)
          element.textContent = emptyText
          return
        }
        const state = { value: previous?.value ?? target, target, format, frame: 0 }
        metricAnimations.set(element, state)
        const from = state.value,
          started = performance.now()
        function tick(now) {
          const progress =
            !previous || reducedMotion.matches || from === target ? 1 : Math.min(1, (now - started) / 600)
          state.value = from + (target - from) * (1 - (1 - progress) ** 3)
          element.textContent = format(state.value)
          state.frame = progress < 1 ? requestAnimationFrame(tick) : 0
        }
        tick(started)
      }
      function finishMetricAnimations() {
        metricAnimations.forEach((state, element) => {
          cancelAnimationFrame(state.frame)
          state.frame = 0
          state.value = state.target
          element.textContent = state.format(state.target)
        })
      }
      // 固定外层命中区域，内层旋转；弹性过渡的合成角度始终限制在 2°。
      function bindCardTilt(card) {
        const slot = card.parentElement
        let x = 0,
          y = 0,
          vx = 0,
          vy = 0,
          targetX = 0,
          targetY = 0,
          frame = 0,
          last = 0
        function apply() {
          const length = Math.hypot(x, y)
          card.style.setProperty('--tilt-x', String(length ? x / length : 0))
          card.style.setProperty('--tilt-y', String(length ? y / length : 1))
          card.style.setProperty('--tilt-angle', `${Math.min(2, length)}deg`)
        }
        function tick(now) {
          const dt = last ? Math.min((now - last) / 16.667, 2) : 1
          last = now
          vx = (vx + (targetX - x) * 0.1 * dt) * Math.pow(0.78, dt)
          vy = (vy + (targetY - y) * 0.1 * dt) * Math.pow(0.78, dt)
          x += vx * dt
          y += vy * dt
          apply()
          frame = 0
          if (Math.abs(targetX - x) + Math.abs(targetY - y) + Math.abs(vx) + Math.abs(vy) > 0.008) start()
          else {
            x = targetX
            y = targetY
            last = 0
            apply()
          }
        }
        function start() {
          if (!frame) frame = requestAnimationFrame(tick)
        }
        function reset() {
          targetX = targetY = 0
          if (reducedMotion.matches || !finePointer.matches) {
            cancelAnimationFrame(frame)
            frame = last = x = y = vx = vy = 0
            apply()
          } else start()
        }
        function move(event) {
          if (reducedMotion.matches || !finePointer.matches || event.pointerType !== 'mouse') return reset()
          const rect = slot.getBoundingClientRect()
          const px = ((event.clientX - rect.left) / rect.width - 0.5) * 2
          const py = ((event.clientY - rect.top) / rect.height - 0.5) * 2
          if (Math.abs(px) > 1 || Math.abs(py) > 1) {
            if (targetX || targetY) reset()
            return
          }
          const length = Math.max(1, Math.hypot(px, py))
          targetX = (-py / length) * 1.5
          targetY = (px / length) * 1.5
          start()
        }
        document.addEventListener('pointermove', move, { capture: true, passive: true })
        slot.addEventListener('pointerleave', reset)
        document.addEventListener('pointercancel', reset, true)
        window.addEventListener('blur', reset)
        window.addEventListener('scroll', reset, { capture: true, passive: true })
        reducedMotion.addEventListener('change', reset)
        finePointer.addEventListener('change', reset)
        return {
          reset,
          dispose() {
            document.removeEventListener('pointermove', move, true)
            slot.removeEventListener('pointerleave', reset)
            document.removeEventListener('pointercancel', reset, true)
            window.removeEventListener('blur', reset)
            window.removeEventListener('scroll', reset, true)
            reducedMotion.removeEventListener('change', reset)
            finePointer.removeEventListener('change', reset)
            cancelAnimationFrame(frame)
          },
        }
      }
      const tilts = [...document.querySelectorAll('.metric-card')].map(bindCardTilt)
      subscriptions.push(() => tilts.forEach((tilt) => tilt.dispose()))
      try {
        if (!window.VChart?.default) throw new Error('VChart 加载失败，请检查网络后刷新')
        const VChart = window.VChart.default
        const [{ VBI }, { VQuery }, { Builder, registerAll }] = await Promise.all([
          import('https://cdn.jsdelivr.net/npm/@visactor/vbi@0.6.4/+esm'),
          import('https://cdn.jsdelivr.net/npm/@visactor/vquery@0.6.4/dist/browser/esm/browser.js/+esm'),
          import('https://cdn.jsdelivr.net/npm/@visactor/vseed@0.6.4/+esm'),
        ])
        registerAll()
        const money = (value) => `¥${Math.round(value).toLocaleString('zh-CN')}`
        const dateKey = (day) => new Date(day * 86400000).toISOString().slice(0, 10)
        // 内置的确定性演示数据：60 天、两个地区，每个订单有两条商品明细。
        // 实际接入时替换 rawDataset 与 schema，不改变后续 Builder 查询链路。
        const firstDay = Date.UTC(2026, 7, 1) / 86400000
        const rawDataset = Array.from({ length: 60 }, (_, day) =>
          ['华东', '华北'].flatMap((region, index) =>
            [0, 1].map((item) => ({
              order_id: `${day}-${index}`,
              order_day: firstDay + day,
              order_date: dateKey(firstDay + day),
              region,
              customer_type: (day + index) % 3 ? '消费者' : '企业',
              sales: 400 + day * 12 + index * 80 + item * 100 + [0, 240, 40, 720, 100, 500, 180][day % 7],
              profit: day % 11 === 0 ? -80 : 60 + day * 2 + index * 10 + item * 15,
            })),
          ),
        ).flat()
        const lastDay = Math.max(...rawDataset.map((row) => row.order_day))
        const schema = [
          { name: 'order_id', type: 'string' },
          { name: 'order_day', type: 'number' },
          { name: 'order_date', type: 'string' },
          { name: 'region', type: 'string' },
          { name: 'customer_type', type: 'string' },
          { name: 'sales', type: 'number' },
          { name: 'profit', type: 'number' },
        ]
        const connectorId = 'vbi-dashboard-template'
        const query = new VQuery()
        const source = { type: 'json', rawDataset }
        if (await query.hasDataset(connectorId)) await query.updateDatasetSource(connectorId, schema, source)
        else await query.createDataset(connectorId, schema, source)
        VBI.connectors.register(connectorId, {
          discoverSchema: async () => schema,
          query: async ({ queryDSL }) => {
            const dataset = await query.connectDataset(connectorId)
            try {
              return await dataset.query(queryDSL)
            } finally {
              await dataset.disconnect()
            }
          },
        })

        function createChart(type, dimension, fields) {
          const chart = VBI.chart.create(VBI.chart.createEmpty(connectorId))
          chart.chartType.changeChartType(type)
          if (dimension)
            chart.dimensions.add(dimension, (node) =>
              node
                .setAlias(dimension === 'region' ? '地区' : '日期')
                .setEncoding(type === 'table' ? 'column' : 'xAxis')
                .setSort({ order: 'asc' }),
            )
          fields.forEach((field) =>
            chart.measures.add(field, (node) =>
              node
                .setAlias({ sales: '销售额', profit: '利润', order_id: '订单数' }[field])
                .setAggregate({ func: field === 'order_id' ? 'countDistinct' : 'sum' })
                .setFormat({ type: 'number', fractionDigits: 0 }),
            ),
          )
          return chart
        }
        const totals = createChart('table', null, ['sales', 'order_id', 'profit'])
        const previous = createChart('table', null, ['sales', 'order_id', 'profit'])
        const trend = createChart('area', 'order_date', ['sales'])
        const growth = createChart('area', 'order_date', ['sales'])
        const profit = createChart('column', 'order_date', ['profit'])
        const regions = createChart('table', 'region', ['sales', 'order_id', 'profit'])
        const consumers = createChart('table', null, ['order_id'])
        const dailyTotals = createChart('table', 'order_date', ['sales', 'order_id', 'profit'])
        const dailyConsumers = createChart('table', 'order_date', ['order_id'])
        const charts = [totals, previous, trend, profit, regions, growth, consumers, dailyTotals, dailyConsumers]
        for (const chart of [consumers, dailyConsumers])
          chart.whereFilter.add('customer_type', (node) => node.setOperator('eq').setValue('消费者'))
        // 仅在自定义 HTML 边界映射字段；图形 seed 始终保留 VBI 生成的 ID。
        function rowsOf(chart, seed) {
          const { dimensions, measures } = chart.build()
          return seed.dataset.map((row) =>
            Object.fromEntries([...dimensions, ...measures].map((field) => [field.field, row[field.id]])),
          )
        }

        const empty = VBI.dashboard.createEmpty()
        const dashboard = VBI.dashboard.create({ ...empty, breakpoints: { ...empty.breakpoints, lg: 800 } })
        const insight = VBI.insight.create(VBI.insight.createEmpty())
        const position = (x, y, w, h) => ({ x, y, w, h })
        dashboard.insight.add((widget) => {
          widget
            .setInsightId(insight)
            .setTitle('核心发现')
            .setLayouts({ lg: position(0, 0, 12, 1), xs: position(0, 0, 12, 1) })
          $('#insight-slot').dataset.widget = widget.getId()
        })
        for (const [id, chart, title, lg, xs] of [
          ['hero-slot', trend, '销售总额', position(0, 1, 8, 9), position(0, 1, 12, 9)],
          ['growth-slot', growth, '销售增长', position(8, 1, 4, 3), position(0, 10, 12, 3)],
          ['orders-slot', totals, '订单总数', position(8, 4, 4, 3), position(0, 13, 12, 3)],
          ['profit-slot', profit, '利润', position(8, 7, 4, 3), position(0, 16, 12, 3)],
        ])
          dashboard.chart.add((widget) => {
            widget.setChart(chart).setTitle(title).setLayouts({ lg, xs })
            $(`#${id}`).dataset.widget = widget.getId()
          })
        function layoutDashboard() {
          const dsl = dashboard.build()
          const breakpoint = grid.clientWidth >= dsl.breakpoints.lg ? 'lg' : 'xs'
          const ordered = [...dsl.layout[breakpoint]].sort((a, b) => a.y - b.y || a.x - b.x)
          const focused = document.activeElement
          for (const [index, item] of ordered.entries()) {
            const card = grid.querySelector(`[data-widget="${item.widgetId}"]`)
            if (grid.children[index] !== card) grid.insertBefore(card, grid.children[index] ?? null)
            card.style.gridColumn = `${item.x + 1} / span ${item.w}`
            card.style.gridRow = `${item.y + 1} / span ${item.h}`
            card.dataset.enter = index + 1
          }
          if (grid.contains(focused) && document.activeElement !== focused) focused.focus({ preventScroll: true })
          instances.forEach((instance, element) => instance.resize(element.clientWidth, element.clientHeight))
        }
        observer = new ResizeObserver(layoutDashboard)
        observer.observe(grid)
        layoutDashboard()

        // 本模板仅拥有一个日期条件和一个地区条件；分别保存 ID，保留其他条件。
        const filterIds = new Map(charts.map((chart) => [chart, {}]))
        function applyFilters(days, region) {
          for (const chart of charts)
            chart.doc.transact(() => {
              const ids = filterIds.get(chart)
              const end = chart === previous ? lastDay - days : lastDay
              const updateDate = (node) =>
                node
                  .setOperator('between')
                  .setValue({ min: end - days + 1 - (chart === dailyTotals ? 1 : 0), max: end })
              if (ids.date) chart.whereFilter.update(ids.date, updateDate)
              else
                chart.whereFilter.add('order_day', (node) => {
                  updateDate(node)
                  ids.date = node.getId()
                })
              if (region) {
                const updateRegion = (node) => node.setOperator('eq').setValue(region)
                if (ids.region) chart.whereFilter.update(ids.region, updateRegion)
                else
                  chart.whereFilter.add('region', (node) => {
                    updateRegion(node)
                    ids.region = node.getId()
                  })
              } else if (ids.region) {
                chart.whereFilter.remove(ids.region)
                delete ids.region
              }
            })
        }
        function comparison(value, baseline) {
          if (!Number.isFinite(baseline) || baseline === 0) return { text: '暂无可比数据', direction: 'neutral' }
          const percent = ((value - baseline) / Math.abs(baseline)) * 100
          return {
            value: percent,
            text: percent === 0 ? '持平 0.0%' : `${percent > 0 ? '↑ 增长' : '↓ 下跌'} ${Math.abs(percent).toFixed(1)}%`,
            direction: percent === 0 ? 'neutral' : percent > 0 ? 'up' : 'down',
          }
        }
        // 从同一筛选范围的聚合结果计算；不平均逐日比率，不从格式化文本反算。
        function deriveMetrics(total) {
          const ratio = (value, base) =>
            Number.isFinite(value) && Number.isFinite(base) && base > 0 ? value / base : undefined
          const margin = ratio(total.profit, total.sales)
          return {
            margin: margin === undefined ? undefined : margin * 100,
            average: ratio(total.sales, total.order_id),
          }
        }
        function pointChange(current, previous) {
          if (!Number.isFinite(current) || !Number.isFinite(previous)) return '暂无可比数据'
          const delta = current - previous
          if (Math.abs(delta) < 0.05) return '基本持平'
          return `${delta > 0 ? '↑ 提升' : '↓ 下降'} ${Math.abs(delta).toFixed(1)} 个百分点`
        }
        // 规模与质量一起解释；仅描述数据关系，不推断营销、成本等未提供的原因。
        function summarizeKeyFinding(total, prior) {
          if (!Number.isFinite(total.order_id) || total.order_id <= 0)
            return '当前筛选范围暂无有效订单，暂无法形成比较结论。'
          const current = deriveMetrics(total)
          const previous = deriveMetrics(prior)
          if (
            !['sales', 'order_id', 'profit'].every(
              (field) => Number.isFinite(total[field]) && Number.isFinite(prior[field]),
            ) ||
            total.sales <= 0 ||
            prior.sales <= 0 ||
            prior.order_id <= 0
          )
            return '部分指标缺少有效比较基数，请结合下方核心与衍生指标查看本期表现。'
          const sales = ((total.sales - prior.sales) / prior.sales) * 100
          const orders = ((total.order_id - prior.order_id) / prior.order_id) * 100
          const average = ((current.average - previous.average) / previous.average) * 100
          const margin = current.margin - previous.margin
          const direction = (delta, up, down) => (Math.abs(delta) < 0.05 ? '基本持平' : delta > 0 ? up : down)
          const scale =
            sales >= 0.05 && orders <= -0.05
              ? '销售增长伴随订单减少'
              : `销售额${direction(sales, '增长', '下降')}，订单数${direction(orders, '增加', '减少')}`
          return `${scale}；客单价${direction(average, '提升', '下降')}，利润率${direction(margin, '提升', '回落')}。`
        }
        const renderInsight = () => {
          const [conclusion, scope, ...lines] = insight.build().content.split('\n')
          $('#conclusion').textContent = conclusion
          $('#insight-scope').textContent = scope
          $('#evidence').replaceChildren(
            ...lines.map((text) => {
              const li = document.createElement('li')
              const [metric, change] = text.split('，')
              li.append(`${metric}，`)
              const span = document.createElement('span')
              span.className = 'change'
              span.dataset.direction = change.startsWith('↑') ? 'up' : change.startsWith('↓') ? 'down' : 'neutral'
              span.textContent = change
              li.append(span)
              return li
            }),
          )
        }
        insight.dsl.observeDeep(renderInsight)
        subscriptions.push(() => insight.dsl.unobserveDeep(renderInsight))
        function buildChartSpec(seed, mini = false) {
          const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()
          const spec = Builder.from({
            ...seed,
            backgroundColor: 'transparent',
            animation: updateAnimation(),
            color: { colorScheme: [accent] },
            label: { enable: false },
            legend: { enable: false },
            xAxis: { visible: false },
            yAxis: { visible: false, zero: true },
            crosshairLine: { labelVisible: false },
            crosshairRect: { labelVisible: false },
            tooltip: { enable: true },
            pointStyle: { pointVisible: false },
            lineStyle: { lineWidth: mini ? 1.5 : 2.5, lineSmooth: true },
            areaStyle: { areaColorOpacity: 0.27, areaGradient: true },
            barStyle: [
              { barRadius: 2, barColor: accent, barColorOpacity: 0.68, barGradient: false },
              {
                selector: { field: seed.measures[0].id, operator: '<', value: 0 },
                barColor: '#d47c6a',
                barGradient: false,
              },
            ],
          }).build()
          spec.padding = { top: 8, right: 6, bottom: 4, left: 3 }
          if (seed.chartType === 'column') spec.stackCornerRadius = 0
          return spec
        }
        function updateAnimation() {
          return {
            enable: !reducedMotion.matches,
            params: { appear: { enable: false }, update: { enable: true, duration: 600, ease: 'cubicInOut' } },
          }
        }
        function buildRingSpec(share, hasOrders) {
          const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()
          const spec = Builder.from({
            chartType: 'donut',
            dataset: [
              { category: '消费者', share: hasOrders ? share : 0 },
              { category: '其他客户', share: hasOrders ? 100 - share : 0 },
            ],
            dimensions: [{ id: 'category', alias: '客户类型', encoding: 'color' }],
            measures: [
              {
                id: 'share',
                alias: '订单占比',
                encoding: 'angle',
                format: { type: 'number', suffix: '%', fractionDigits: 1 },
              },
            ],
            backgroundColor: 'transparent',
            color: { colorScheme: [accent, '#e9edf0'] },
            label: { enable: false },
            legend: { enable: false },
            innerRadius: 0.76,
            outerRadius: 0.98,
            pieStyle: { pieBorderWidth: 0, pieHoverEffect: 'opacity' },
            animation: updateAnimation(),
            tooltip: { enable: hasOrders },
          }).build()
          spec.padding = 0
          return spec
        }
        async function draw(selector, chart, seed) {
          const element = $(selector)
          const spec = chart ? buildChartSpec(seed, chart !== trend) : seed
          if (instances.has(element)) {
            if (reducedMotion.matches) instances.get(element).stopAnimation()
            await instances.get(element).updateSpec(spec)
          } else {
            const instance = new VChart(spec, { dom: element })
            instance.renderSync()
            chart?.instance.bind(instance)
            instances.set(element, instance)
          }
        }
        function setChange(selector, change) {
          $(selector).dataset.direction = change.direction
          animateMetric(
            selector,
            change.value,
            (value) => {
              $(selector).dataset.direction = value === 0 ? 'neutral' : value > 0 ? 'up' : 'down'
              return value === 0 ? '持平 0.0%' : `${value > 0 ? '↑ 增长' : '↓ 下跌'} ${Math.abs(value).toFixed(1)}%`
            },
            change.text,
          )
        }
        async function showMetrics(total, prior, consumerTotal, label, scope = 'all') {
          const salesChange = comparison(total.sales, prior.sales)
          if (scope === 'all') {
            animateMetric('#sales', total.sales, money)
            animateMetric(
              '#margin',
              total.sales ? (total.profit / total.sales) * 100 : undefined,
              (value) => `${value.toFixed(1)}%`,
            )
            animateMetric('#average', total.order_id ? total.sales / total.order_id : undefined, money)
            setChange('#sales-change', salesChange)
          }
          if (scope === 'all' || scope === 'growth')
            animateMetric('#growth', salesChange.value, (value) => {
              $('#growth').dataset.direction = value === 0 ? 'neutral' : value > 0 ? 'up' : 'down'
              return `${value > 0 ? '+' : ''}${value.toFixed(1)}%`
            })
          if (scope === 'all' || scope === 'profit') {
            animateMetric('#profit', total.profit, money)
            setChange('#profit-change', comparison(total.profit, prior.profit))
          }
          document
            .querySelectorAll(scope === 'all' ? '.compare-label' : `#${scope}-card .compare-label`)
            .forEach((element) => (element.textContent = label))
          if (scope === 'all') {
            animateMetric('#orders', total.order_id, (value) => `${Math.round(value)} 单`)
            setChange('#orders-change', comparison(total.order_id, prior.order_id))
            const share = total.order_id ? (consumerTotal.order_id / total.order_id) * 100 : 0
            animateMetric('#consumer-share', total.order_id ? share : undefined, (value) => `${Math.round(value)}%`)
            await draw('#consumer-ring-plot', null, buildRingSpec(share, total.order_id > 0))
          }
        }
        let currentMetrics,
          metricsReady = false
        const hoverSubscriptions = new Map()
        function clearHover() {
          hoverSubscriptions.forEach((subscription) => subscription.reset())
          instances.forEach((instance) => instance.hideTooltip())
        }
        function bindMetricHover(chart, selector, scope) {
          let timer,
            pendingDate,
            shownDate,
            keyboardActive = false
          function reset() {
            clearTimeout(timer)
            pendingDate = shownDate = undefined
            keyboardActive = false
          }
          function restore() {
            const shouldRestore = shownDate !== undefined || keyboardActive
            reset()
            if (shouldRestore && metricsReady) void currentMetrics.restore(scope)
          }
          function onHover({ action, dimensionInfo }) {
            if (!metricsReady) return reset()
            if (action === 'leave') return restore()
            const date = dimensionInfo?.[0]?.value
            if (typeof date !== 'string' || date === pendingDate) return
            clearTimeout(timer)
            pendingDate = undefined
            if (date === shownDate) return
            pendingDate = date
            timer = setTimeout(() => {
              pendingDate = undefined
              if (!metricsReady || disposed) return
              shownDate = date
              void currentMetrics.showDate(date, scope)
            }, 75)
          }
          function onKey(event) {
            if (!metricsReady) return
            if (event.key === 'Escape') {
              event.preventDefault()
              reset()
              void currentMetrics.restore(scope)
            }
            if (['ArrowLeft', 'ArrowRight'].includes(event.key)) {
              event.preventDefault()
              reset()
              keyboardActive = true
              void currentMetrics.step(event.key === 'ArrowLeft' ? -1 : 1, scope)
            }
          }
          const element = $(selector)
          chart.instance.on('dimensionHover', onHover)
          element.addEventListener('keydown', onKey)
          element.addEventListener('pointerleave', restore)
          element.addEventListener('blur', restore)
          return {
            reset,
            dispose() {
              reset()
              chart.instance.off('dimensionHover', onHover)
              element.removeEventListener('keydown', onKey)
              element.removeEventListener('pointerleave', restore)
              element.removeEventListener('blur', restore)
            },
          }
        }
        subscriptions.push(() => hoverSubscriptions.forEach((subscription) => subscription.dispose()))

        let revision = 0,
          completed = 0,
          rendering = false,
          queued = false
        function requestRender() {
          metricsReady = false
          clearHover()
          revision++
          if (queued || disposed) return
          queued = true
          queueMicrotask(() => {
            queued = false
            if (!rendering && !disposed) void renderLoop()
          })
        }
        async function renderLoop() {
          rendering = true
          document.querySelectorAll('fieldset').forEach((controls) => (controls.disabled = true))
          grid.setAttribute('aria-busy', 'true')
          document.body.dataset.state = 'loading'
          $('#status').textContent = '正在查询…'
          while (completed !== revision && !disposed) {
            const current = revision
            try {
              const seeds = await Promise.all(charts.map((chart) => chart.buildVSeed()))
              if (disposed || current !== revision) continue
              const values = (chart, seed) =>
                Object.fromEntries(
                  Object.entries(rowsOf(chart, seed)[0] ?? {}).map(([key, value]) => [key, Number(value ?? 0)]),
                )
              const total = { sales: 0, profit: 0, order_id: 0, ...values(totals, seeds[0]) }
              const prior = { sales: 0, profit: 0, order_id: 0, ...values(previous, seeds[1]) }
              const period = trend.whereFilter
                .find((node) => 'getField' in node && node.getField() === 'order_day')
                .toJSON().value
              const days = period.max - period.min + 1
              const region = $('[data-region][aria-pressed="true"]').dataset.region
              const scope = `${dateKey(period.min)} — ${dateKey(period.max)} · ${region || '全部地区'}`
              $('#scope').textContent = scope
              document
                .querySelectorAll('.compare-label')
                .forEach((element) => (element.textContent = `较前 ${days} 天`))
              const evidence = []
              for (const [field, id, label, format] of [
                ['sales', 'sales', '销售额', money],
                ['order_id', 'orders', '订单数', (value) => `${value} 单`],
                ['profit', 'profit', '利润', money],
              ]) {
                const change = comparison(total[field], prior[field])
                evidence.push(`${label}：${format(total[field])}，${change.text}。`)
              }
              const derived = deriveMetrics(total)
              const priorDerived = deriveMetrics(prior)
              evidence.push(
                `利润率：${Number.isFinite(derived.margin) ? `${derived.margin.toFixed(1)}%` : '—'}，${pointChange(derived.margin, priorDerived.margin)}。`,
                `平均客单价：${Number.isFinite(derived.average) ? money(derived.average) : '—'}，${Number.isFinite(derived.average) ? comparison(derived.average, priorDerived.average).text : '暂无可比数据'}。`,
              )
              const finding = summarizeKeyFinding(total, prior)
              insight.setContent(
                [finding, `3 项核心指标 · 2 项衍生指标 · ${scope} · 对比前 ${days} 天`, ...evidence].join('\n'),
              )
              $('#dates').replaceChildren(
                ...[period.min, Math.floor((period.min + period.max) / 2), period.max].map((day) => {
                  const span = document.createElement('span')
                  span.textContent = dateKey(day).slice(5).replace('-', '/')
                  return span
                }),
              )
              $('#trend').hidden = !total.order_id
              $('#trend-empty').hidden = !!total.order_id
              $('#profit-trend').hidden = !total.order_id
              $('#growth-trend').hidden = !total.order_id
              $('#consumer-ring-plot').hidden = !total.order_id
              $('#regions').replaceChildren(
                ...rowsOf(regions, seeds[4]).map((row) => {
                  const tr = document.createElement('tr')
                  for (const value of [
                    row.region,
                    money(row.sales),
                    row.order_id,
                    row.sales ? `${((row.profit / row.sales) * 100).toFixed(1)}%` : '—',
                  ]) {
                    const td = document.createElement('td')
                    td.textContent = String(value)
                    tr.append(td)
                  }
                  return tr
                }),
              )
              if (total.order_id)
                await Promise.all([
                  draw('#trend', trend, seeds[2]),
                  draw('#profit-trend', profit, seeds[3]),
                  draw('#growth-trend', growth, seeds[5]),
                ])
              if (disposed || current !== revision) continue
              const emptyTotals = { sales: 0, order_id: 0, profit: 0 }
              const byDate = new Map(rowsOf(dailyTotals, seeds[7]).map((row) => [row.order_date, row]))
              const consumersByDate = new Map(rowsOf(dailyConsumers, seeds[8]).map((row) => [row.order_date, row]))
              const consumerTotal = { order_id: 0, ...values(consumers, seeds[6]) }
              const selectedDays = new Map()
              function restore(scope = 'all') {
                selectedDays.delete(scope)
                if (scope === 'all') {
                  selectedDays.clear()
                  $('#hover-scope').textContent = '区间汇总 · 悬停查看当日'
                }
                return showMetrics(total, prior, consumerTotal, `较前 ${days} 天`, scope)
              }
              function showDate(date, scope = 'all') {
                const day = Date.parse(date) / 86400000
                if (day < period.min || day > period.max || !Number.isInteger(day)) return restore(scope)
                selectedDays.set(scope, day)
                if (scope === 'all') $('#hover-scope').textContent = `${date} · 当日指标`
                return showMetrics(
                  byDate.get(date) ?? emptyTotals,
                  byDate.get(dateKey(day - 1)) ?? emptyTotals,
                  consumersByDate.get(date) ?? emptyTotals,
                  `${date.slice(5)} · 较前一天`,
                  scope,
                )
              }
              currentMetrics = {
                restore,
                showDate,
                step(delta, scope = 'all') {
                  const from = selectedDays.get(scope) ?? (delta < 0 ? period.max + 1 : period.min - 1)
                  return showDate(dateKey(Math.max(period.min, Math.min(period.max, from + delta))), scope)
                },
              }
              for (const [chart, selector, scope] of [
                [trend, '#trend', 'all'],
                [growth, '#growth-trend', 'growth'],
                [profit, '#profit-trend', 'profit'],
              ]) {
                if (total.order_id && !hoverSubscriptions.has(chart))
                  hoverSubscriptions.set(chart, bindMetricHover(chart, selector, scope))
              }
              await restore()
              if (disposed || current !== revision) continue
              layoutDashboard()
              document.body.dataset.initialized = 'true'
              $('#dashboard-content').inert = false
              document.body.dataset.state = total.order_id ? 'ready' : 'empty'
              metricsReady = !!total.order_id
              $('#status').textContent = `内置演示数据 · ${rawDataset.length} 条商品明细 · 截至 ${dateKey(lastDay)}`
              revealComponents()
            } catch (error) {
              if (disposed || current !== revision) continue
              document.body.dataset.state = 'error'
              $('#status').textContent = `更新失败：${error.message}`
              console.error(error)
              finishEntrance()
            }
            completed = current
          }
          rendering = false
          if (!disposed) {
            document.querySelectorAll('fieldset').forEach((controls) => (controls.disabled = false))
            $('.date-controls').disabled = !metricsReady
            grid.setAttribute('aria-busy', 'false')
          }
        }
        for (const chart of charts) {
          chart.dsl.observeDeep(requestRender)
          subscriptions.push(() => chart.dsl.unobserveDeep(requestRender))
        }
        document.querySelectorAll('[data-days], [data-region]').forEach((button) =>
          button.addEventListener('click', () => {
            const attribute = button.hasAttribute('data-days') ? 'data-days' : 'data-region'
            document
              .querySelectorAll(`[${attribute}]`)
              .forEach((item) => item.setAttribute('aria-pressed', String(item === button)))
            applyFilters(
              Number($('[data-days][aria-pressed="true"]').dataset.days),
              $('[data-region][aria-pressed="true"]').dataset.region,
            )
          }),
        )
        document.querySelectorAll('[data-date-step]').forEach((button) =>
          button.addEventListener('click', () => {
            if (metricsReady) {
              clearHover()
              void currentMetrics.step(Number(button.dataset.dateStep))
            }
          }),
        )
        $('#restore-metrics').addEventListener('click', () => {
          clearHover()
          void currentMetrics?.restore('all')
        })
        function onMotionChange() {
          if (reducedMotion.matches) {
            finishEntrance()
            finishMetricAnimations()
          }
          requestRender()
        }
        reducedMotion.addEventListener('change', onMotionChange)
        subscriptions.push(() => reducedMotion.removeEventListener('change', onMotionChange))
        subscriptions.push(() => charts.forEach((chart) => chart.instance.bind(undefined)))
        applyFilters(30, '')
        requestRender()
      } catch (error) {
        document.body.dataset.state = 'error'
        grid.setAttribute('aria-busy', 'false')
        $('#status').textContent = `初始化失败：${error.message}`
        finishEntrance()
        console.error(error)
      }
      window.addEventListener('pagehide', (event) => {
        if (event.persisted) return
        disposed = true
        observer?.disconnect()
        subscriptions.forEach((unsubscribe) => unsubscribe())
        instances.forEach((instance) => instance.release())
        instances.clear()
        metricAnimations.forEach((state) => cancelAnimationFrame(state.frame))
        metricAnimations.clear()
        finishEntrance()
      })
    </script>
  </body>
</html>
