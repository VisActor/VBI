      <script>
        const catalog = JSON.parse(document.querySelector('#catalog').textContent)
        let index = Math.max(
            0,
            catalog.findIndex((entry) => entry.path === new URLSearchParams(location.search).get('template')),
          ),
          mode = 'desktop'
        function render() {
          const entry = catalog[index],
            suffix = mode === 'mobile' ? '-mobile' : ''
          document.body.dataset.mode = mode
          document.querySelector('#title').textContent = entry.title + ' · 视觉对照'
          document.querySelector('#count').textContent =
            `${index + 1} / ${catalog.length} · ${mode === 'mobile' ? '390 × 844' : '1440 × 1000'}`
          document.querySelector('#reason').textContent = entry.layoutReason + ' ' + entry.colorReason
          const image = entry.path.replace('.html', suffix + '.png')
          document.querySelector('#target').src = image
          document.querySelector('#target-image-link').href = image
          document.querySelector('#target-link').href = entry.path
          document.querySelector('#target-link').textContent = entry.title
          document.querySelectorAll('.reference').forEach((image) => {
            image.src = `${image.dataset.stem}${suffix}.png`
            image.parentElement.href = image.src
          })
          document.querySelector('#previous').disabled = index === 0
          document.querySelector('#next').disabled = index === catalog.length - 1
          document.querySelectorAll('[data-mode]').forEach((button) => {
            if (button.tagName === 'BUTTON') button.setAttribute('aria-pressed', String(button.dataset.mode === mode))
          })
          history.replaceState(null, '', '?template=' + encodeURIComponent(entry.path))
        }
        document.querySelector('#previous').addEventListener('click', () => {
          index--
          render()
        })
        document.querySelector('#next').addEventListener('click', () => {
          index++
          render()
        })
        document.querySelectorAll('button[data-mode]').forEach((button) =>
          button.addEventListener('click', () => {
            mode = button.dataset.mode
            render()
          }),
        )
        render()
      </script>
