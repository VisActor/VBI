<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>模板视觉对照</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eef2f7;
        color: #293744;
        font:
          14px/1.7 Inter,
          'PingFang SC',
          sans-serif;
      }
      main {
        padding: 32px;
        max-width: 1800px;
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 27px;
        margin: 8px 0;
      }
      p {
        color: #627283;
        margin: 6px 0;
      }
      a {
        color: #345b85;
        text-underline-offset: 4px;
      }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        font: inherit;
        cursor: pointer;
        background: white;
        border: 0;
        border-radius: 20px;
        padding: 8px 16px;
        color: inherit;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button[aria-pressed='true'] {
        background: #304c6b;
        color: white;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #527eaf;
        outline-offset: 4px;
      }
      .comparison {
        overflow: auto;
        margin-top: 26px;
      }
      .columns {
        display: grid;
        grid-template-columns: repeat(5, minmax(250px, 1fr));
        gap: 14px;
        align-items: start;
      }
      figure {
        margin: 0;
        background: white;
        border-radius: 14px;
        overflow: hidden;
      }
      figcaption {
        padding: 12px 14px;
        font-weight: 600;
        font-size: 12px;
        border-bottom: 1px solid #e5ebf2;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      .preview {
        display: block;
        position: relative;
        min-height: 240px;
        background: #f4f7fa;
      }
      .preview img {
        transition: opacity 160ms ease;
      }
      .preview[aria-busy='true'] img {
        opacity: 0.25;
      }
      .image-status {
        position: absolute;
        top: 16px;
        left: 12px;
        right: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: white;
        color: #345b85;
        box-shadow: 0 2px 12px #29374412;
        font-size: 12px;
        text-align: center;
      }
      .preview[aria-busy='true'] .image-status::before {
        content: '';
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 8px;
        border: 2px solid #d6e1ed;
        border-top-color: #345b85;
        border-radius: 50%;
        vertical-align: -2px;
        animation: loading 0.8s linear infinite;
      }
      .preview[data-state='error'] img {
        visibility: hidden;
      }
      @keyframes loading {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preview img {
          transition: none;
        }
        .preview .image-status::before {
          animation: none;
        }
      }
      .reason {
        max-width: 1080px;
        margin: 22px 0;
      }
      .hint {
        font-size: 12px;
      }
      body[data-mode='mobile'] .columns {
        grid-template-columns: repeat(5, minmax(220px, 1fr));
      }
      @media (max-width: 650px) {
        main {
          padding: 24px 18px;
        }
        h1 {
          font-size: 23px;
        }
        .columns {
          grid-template-columns: repeat(5, 260px);
        }
      }
    </style>
  </head>
  <body data-mode="desktop">
    <main>
      <header>
        <div>
          <a href="index.html">← 4 份模板总览</a>
          <h1 id="title">模板视觉对照</h1>
          <p id="count"></p>
        </div>
        <nav aria-label="对照操作">
          <button id="previous">← 上一份</button><button id="next">下一份 →</button
          ><button data-mode="desktop" aria-pressed="true">桌面</button
          ><button data-mode="mobile" aria-pressed="false">手机</button>
        </nav>
      </header>
      <p class="reason" id="reason"></p>
      <p class="hint">
        同视口全页截图、相同缩放比例、明细默认展开。点击任一图查看完整
        PNG；比较主辅比例、信息密度、单位、留白与窄屏顺序。
      </p>
      <section class="comparison" aria-label="当前模板与四份基础参考">
        <div class="columns">
          <figure>
            <figcaption><a id="target-link">当前模板</a></figcaption>
            <a id="target-image-link"><img id="target" alt="当前基础模板截图" /></a>
          </figure>
          <figure>
            <figcaption><a href="template-life-expectancy.html">life-expectancy · 趋势主导</a></figcaption>
            <a class="reference-link"
              ><img class="reference" data-stem="template-life-expectancy" alt="趋势主导基准截图"
            /></a>
          </figure>
          <figure>
            <figcaption><a href="template-heart-failure.html">heart-failure · 指标先行</a></figcaption>
            <a class="reference-link"
              ><img class="reference" data-stem="template-heart-failure" alt="指标先行基准截图"
            /></a>
          </figure>
          <figure>
            <figcaption><a href="template-meal-workout.html">meal-workout · 分段叙事</a></figcaption>
            <a class="reference-link"
              ><img class="reference" data-stem="template-meal-workout" alt="分段叙事基准截图"
            /></a>
          </figure>
          <figure>
            <figcaption><a href="template-business-overview.html">business-overview · 经营主辅</a></figcaption>
            <a class="reference-link"
              ><img class="reference" data-stem="template-business-overview" alt="经营主辅基准截图"
            /></a>
          </figure>
        </div>
      </section>
      <!-- prettier-ignore -->
      <script id="catalog" type="application/json">[{"path":"template-life-expectancy.html","title":"全球寿命观察","theme":"#9FBFDF","skin":"soft","description":"2,938 条寿命记录；首尾国家配对、发展状态差距与覆盖变化。","layoutReason":"左侧大趋势承载长期变化，右侧小卡补充变化幅度、覆盖和教育，保持单一视觉中心。","colorReason":"浅蓝与中性阅读面营造平静氛围，让长期曲线和数字优先。","kind":"baseline","industry":"baseline","variant":1},{"path":"template-heart-failure.html","title":"心衰样本观察","theme":"#7664C3","skin":"soft","description":"299 条临床样本；事件数与占比、年龄和高血压状态交叉核对。","layoutReason":"顶部三项指标先概览，下方宽幅条形图再看年龄组；随访天数不伪装成日历趋势。","colorReason":"鸢紫区分数据图形与浅色阅读面；事件状态由标签表达，主题色不暗示风险。","kind":"baseline","industry":"baseline","variant":2},{"path":"template-meal-workout.html","title":"餐食与运动画像","theme":"#D18368","skin":"soft","description":"8,000 条餐食记录；热量与蛋白质密度、活动水平分层核对。","layoutReason":"热量主区下方以运动、营养、样本三列并排呈现，辅助卡高 180px，数字与迷你图紧凑排列，明细承接核对。","colorReason":"杏橙串联餐食与运动各段；浅杏背景承接图形，单位和正文使用中性色。","kind":"baseline","industry":"baseline","variant":3},{"path":"template-business-overview.html","title":"经营概览","theme":"#4F8F76","skin":"soft","description":"轻量销售示例；销售增量贡献、订单与客单变化、利润质量。","layoutReason":"左侧三张辅助卡呈现增长、订单与利润，右侧主趋势承载销售规模，标题右侧合并筛选，明细承接核对。","colorReason":"草绿统一趋势与卡片，浅绿背景衬托白色阅读面，正负变化另用语义色表达。","kind":"baseline","industry":"baseline","variant":4}]</script>
      <script>
        const catalog = JSON.parse(document.querySelector('#catalog').textContent)
        let index = Math.max(
            0,
            catalog.findIndex((entry) => entry.path === new URLSearchParams(location.search).get('template')),
          ),
          mode = 'desktop'
        const previewRequests = new WeakMap()
        function loadPreview(image, source) {
          if (image.dataset.requested === source) return
          const previous = previewRequests.get(image)
          if (previous) previous.src = ''
          image.dataset.requested = source
          const link = image.parentElement,
            status = link.querySelector('.image-status')
          link.dataset.state = 'loading'
          link.setAttribute('aria-busy', 'true')
          link.href = source
          status.hidden = false
          status.textContent = '截图加载中…'
          const pending = new Image()
          previewRequests.set(image, pending)
          pending.decoding = 'async'
          pending.src = source
          pending.decode().then(
            () => {
              if (previewRequests.get(image) !== pending) return
              previewRequests.delete(image)
              image.width = pending.naturalWidth
              image.height = pending.naturalHeight
              image.src = source
              link.dataset.state = 'ready'
              link.setAttribute('aria-busy', 'false')
              status.hidden = true
            },
            () => {
              if (previewRequests.get(image) !== pending) return
              previewRequests.delete(image)
              link.dataset.state = 'error'
              link.setAttribute('aria-busy', 'false')
              status.textContent = '截图加载失败，点击重试'
            },
          )
        }
        document.querySelectorAll('.comparison img').forEach((image) => {
          const link = image.parentElement,
            status = document.createElement('span')
          link.classList.add('preview')
          status.className = 'image-status'
          status.setAttribute('role', 'status')
          link.append(status)
          image.decoding = 'async'
          link.addEventListener('click', (event) => {
            if (link.dataset.state === 'ready') return
            event.preventDefault()
            if (link.dataset.state === 'error') {
              const source = image.dataset.requested
              delete image.dataset.requested
              loadPreview(image, source)
            }
          })
        })
        function render() {
          const entry = catalog[index],
            suffix = mode === 'mobile' ? '-mobile' : ''
          document.body.dataset.mode = mode
          document.querySelector('#title').textContent = entry.title + ' · 视觉对照'
          document.querySelector('#count').textContent =
            `${index + 1} / ${catalog.length} · ${mode === 'mobile' ? '390 × 844' : '1440 × 1000'}`
          document.querySelector('#reason').textContent = entry.layoutReason + ' ' + entry.colorReason
          const image = entry.path.replace('.html', suffix + '.png')
          loadPreview(document.querySelector('#target'), image)
          document.querySelector('#target-link').href = entry.path
          document.querySelector('#target-link').textContent = entry.title
          document.querySelectorAll('.reference').forEach((image) => {
            loadPreview(image, `${image.dataset.stem}${suffix}.png`)
          })
          document.querySelector('#previous').disabled = index === 0
          document.querySelector('#next').disabled = index === catalog.length - 1
          document.querySelectorAll('[data-mode]').forEach((button) => {
            if (button.tagName === 'BUTTON') button.setAttribute('aria-pressed', String(button.dataset.mode === mode))
          })
          history.replaceState(null, '', '?template=' + encodeURIComponent(entry.path))
        }
        document.querySelector('#previous').addEventListener('click', () => {
          index--
          render()
        })
        document.querySelector('#next').addEventListener('click', () => {
          index++
          render()
        })
        document.querySelectorAll('button[data-mode]').forEach((button) =>
          button.addEventListener('click', () => {
            mode = button.dataset.mode
            render()
          }),
        )
        render()
      </script>
    </main>
  </body>
</html>
