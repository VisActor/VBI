<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="vbi-session" content="__VBI_SESSION_TOKEN__" />
    <link rel="icon" href="data:," />
    <title>此刻 · 超市经营观测</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://gibs.earthdata.nasa.gov" crossorigin />
    <link
      id="map-styles"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css"
      media="print"
      onload="this.media = 'all'"
      onerror="this.dataset.failed = 'true'"
    />
    <style>
      /* Theme and shared controls */
      :root {
        color-scheme: dark;
        font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-synthesis: none;
        color: #e8e9ea;
        --accent: #d8b45c;
        --accent-text: #dfc38b;
        --accent-soft: #ead4a0;
        --accent-line: #d8b45c70;
        --accent-glow: #d8b45c2b;
        --muted: #a1a7af;
        --line: #e0e5ed18;
        --primary: clamp(28px, 3.8dvh, 34px);
        --secondary: clamp(20px, 2.7dvh, 24px);
        --derived: 20px;
        --gutter: clamp(16px, 1.5vw, 22px);
        --space: clamp(8px, 1.6dvh, 16px);
        --map-scale-left: 180px;
        --map-scale-bottom: 24px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #181a1c;
      }
      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h2 {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.4px;
      }
      [hidden] {
        display: none !important;
      }
      .meta {
        font-size: 9px;
        color: #9b9ea2;
        letter-spacing: 0.5px;
      }
      .negative {
        color: #ff786d !important;
      }
      .controls,
      .segments,
      .compact-tabs,
      .map-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls {
        gap: 8px;
        min-width: 0;
      }
      .segments {
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
        background: #242629a6;
        border: 1px solid #ffffff12;
        box-shadow: inset 0 1px 1px #e9ecef17;
        backdrop-filter: blur(18px);
      }
      .segments button {
        padding: 6px 10px;
        font-size: 11px;
        color: #b4b6b8;
        border-radius: 7px;
        white-space: nowrap;
      }
      .segments button[aria-pressed='true'] {
        color: #2b2316;
        background: linear-gradient(145deg, #e6ca86, #c19a48);
        box-shadow:
          inset 0 1px 0 #f8edce60,
          inset 0 0 0 1px #ead6a635,
          0 2px 12px #d8b45c30;
      }

      .icon-button {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        border: 1px solid var(--line);
        background: #d0d3d712;
        border-radius: 8px;
        font-size: 13px;
      }
      .icon-button,
      .map-controls button,
      .filter-line button {
        transition:
          color 0.2s,
          background 0.2s,
          border-color 0.2s;
      }
      .icon-button:hover,
      .map-controls button:hover,
      .filter-line button:hover {
        color: var(--accent-soft);
        background: var(--accent-glow);
      }
      .icon-button[aria-pressed='true'] {
        color: var(--accent-soft);
        border-color: var(--accent-line);
      }
      .live {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        color: var(--accent-soft);
        white-space: nowrap;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px #d8b45c70;
      }
      .compact-tabs {
        gap: 3px;
        font-size: 10px;
      }
      .compact-tabs button {
        padding: 5px 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--muted);
        background: #e7eaed06;
      }
      .compact-tabs button:hover {
        background: #e7eaed13;
      }
      .compact-tabs button[aria-pressed='true'] {
        background: linear-gradient(145deg, #d8b45c4a, #c19a4824);
        box-shadow: inset 0 1px 0 #ffffff12;
        border-color: var(--accent-line);
        color: var(--accent-soft);
      }

      /* Desktop occupies one viewport; only tables scroll inside their cards. */
      main {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100dvh;
        padding: var(--space) var(--gutter) 8px;
        display: grid;
        grid-template-rows: minmax(0, 1.55fr) minmax(0, 1fr) auto;
        gap: var(--space);
        pointer-events: none;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        pointer-events: auto;
      }
      header {
        min-height: 34px;
      }
      .stage {
        display: grid;
        grid-template-columns: minmax(320px, 360px) minmax(0, 1fr);
        gap: var(--space);
        min-height: 0;
        min-width: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.95fr) minmax(0, 1.4fr);
        gap: var(--space);
        min-height: 0;
        min-width: 0;
      }
      /* Shared glass: translucent tint, soft reflections and a fine refractive edge. */
      .panel,
      dialog,
      #more-menu {
        background:
          radial-gradient(ellipse at 0 0, #f4f1ea16, transparent 58%),
          radial-gradient(ellipse at 100% 100%, #cbc9d50d, transparent 55%),
          linear-gradient(145deg, #eeeeed08, #14181b03 48%, #e4e1dc05), var(--glass-tint, #15191e66);
        border: 1px solid #e7e7e90b;
        box-shadow:
          0 12px 32px #02030540,
          0 2px 6px #02030526,
          inset 0 1px 2px #fffaf210,
          inset 0 -1px 2px #090b0e2b;
        backdrop-filter: blur(14px) saturate(0.62) brightness(1.08);
        -webkit-backdrop-filter: blur(14px) saturate(0.62) brightness(1.08);
      }
      .panel::before,
      dialog::before,
      #more-menu::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, #f6f7f950, #dbdee20a 35%, #d1d5da0b 68%, #ebedf028);
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask-composite: exclude;
        pointer-events: none;
      }
      .panel {
        position: relative;
        min-width: 0;
        min-height: 0;
        padding: var(--space);
        border-radius: 18px;
        overflow-wrap: anywhere;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
      }
      .panel-head {
        display: flex;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 24px;
        margin-bottom: 10px;
      }
      .hero {
        gap: clamp(6px, 1dvh, 10px);
        overflow: hidden;
        scrollbar-width: thin;
      }
      .hero > * {
        flex-shrink: 0;
      }
      .hero .panel-head {
        margin-bottom: 0;
      }
      footer {
        font-size: 9px;
        color: #95989c;
        line-height: 1.6;
      }
      footer a {
        color: #a7a9ad;
        text-decoration: none;
      }

      /* Nested metric cards */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .kpi {
        min-width: 0;
        container-type: inline-size;
        padding: clamp(7px, 1.1dvh, 10px);
        border-radius: 10px;
        background: linear-gradient(140deg, #edeff113, #dfe1e405 65%, #e9ebee09);
        border: 1px solid #eef0f208;
        box-shadow:
          inset 0 1px 0 #f6f7f90a,
          0 2px 5px #0b0c0d0d;
      }
      .kpi p {
        font-size: 11px;
        color: #abadaf;
        margin-bottom: 5px;
      }
      .kpi strong {
        font-size: var(--secondary);
        font-weight: 300;
        color: #e7e8ea;
        letter-spacing: -0.6px;
        font-variant-numeric: tabular-nums;
      }
      .kpi small {
        font-size: 9px;
        color: #abaeb1;
        white-space: nowrap;
      }
      .hero-value,
      .metric-value {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px;
        min-width: 0;
        line-height: 1.2;
      }
      .metric-value strong {
        font-size: min(var(--secondary), 22cqi);
        white-space: nowrap;
        min-width: 0;
      }
      .revenue-card {
        padding: clamp(10px, 1.5dvh, 14px);
        background:
          radial-gradient(ellipse at 0 0, color-mix(in srgb, var(--accent-text) 12%, transparent), transparent 78%),
          linear-gradient(120deg, color-mix(in srgb, var(--accent) 5%, transparent), #d2d7df06);
        border-color: color-mix(in srgb, var(--accent-text) 24%, transparent);
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, var(--accent-soft) 14%, transparent),
          0 4px 14px #080a0e16;
      }
      .revenue-card .hero-title {
        margin-bottom: 5px;
        color: #bfc2c5;
        font-size: 10px;
      }
      .revenue-card strong {
        font-size: var(--primary);
        color: var(--accent-text);
        font-weight: 300;
        letter-spacing: -1.1px;
        text-shadow: 0 1px 12px color-mix(in srgb, var(--accent) 10%, transparent);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .currency {
        font-size: 14px;
        color: var(--accent-text);
      }
      .revenue-card small {
        font-size: 10px;
        color: #abadb0;
      }
      .quality-summary {
        margin-top: auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .quality-summary strong {
        font-size: 18px;
      }
      .quality-summary p {
        font-size: 10px;
      }
      .quality-summary button {
        text-align: left;
      }
      .quality-summary button:hover {
        border-color: var(--accent-line);
        background: var(--accent-glow);
      }
      .comparisons {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        margin-top: 6px;
        font-size: 10px;
        line-height: 1.4;
        color: #9fa1a5;
      }
      .comparisons span {
        white-space: nowrap;
      }
      .comparisons b {
        font-size: inherit;
        font-weight: 450;
        color: #c8cacd;
        font-variant-numeric: tabular-nums;
      }
      .comparisons b[data-direction='up'] {
        color: var(--accent-text);
      }
      .comparisons b[data-direction='down'] {
        color: #ff786d;
      }
      /* Charts and the live order stream */
      .plot {
        width: 100%;
        min-width: 0;
        min-height: 0;
        flex: 1;
        contain: size;
      }
      .trend-top {
        margin-bottom: 6px;
        flex-shrink: 0;
      }
      .trend-readout {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 3px 6px;
        font-size: var(--derived);
        color: var(--accent-text);
        font-variant-numeric: tabular-nums;
      }
      .trend-readout small {
        font-size: 9px;
        color: #a1a3a6;
      }
      #peak-time {
        margin-top: 5px;
      }
      .chart-keyboard {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .chart-keyboard:focus-within {
        position: static;
        width: auto;
        height: auto;
        clip-path: none;
        overflow: auto;
      }
      .chart-keyboard button {
        display: block;
        padding: 6px;
        text-align: left;
      }
      .empty-message {
        font-size: 11px;
        line-height: 1.8;
        text-align: center;
        padding: 24px 0;
        color: #a1a3a6;
      }
      .detail-scope {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        font-size: 10px;
        color: var(--accent-soft);
      }
      .detail-scope span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .detail-scope button {
        flex-shrink: 0;
      }
      .table-wrap {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: #c5c8cc33 transparent;
        overflow-anchor: none;
        border: 1px solid #e8eaed0b;
        border-radius: 8px;
        background: #1516181f;
      }
      .stream .meta {
        font-size: 8px;
      }
      .table-action {
        margin-left: auto;
        border: 1px solid #b5b9bf33;
        border-radius: 6px;
        padding: 5px 8px;
        color: #d0d5db;
        font-size: 10px;
      }

      /* MapLibre owns projection and marker transforms. */
      #map {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #1c1e21;
        opacity: 0;
        visibility: hidden;
      }
      body[data-state='ready'][data-map-ready='true'] #map {
        opacity: 1;
        visibility: visible;
      }
      #map .maplibregl-canvas-container::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(90deg, #1114174d, transparent 45%),
          linear-gradient(180deg, #11151bcc, transparent 32%, #15191d08 63%, #1014188c), #22262c0a;
        box-shadow: inset 0 0 160px #0b0c0e4d;
      }
      .map-flights {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      .map-flight path {
        fill: none;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
      .flight-track {
        stroke: #e2c27c;
        stroke-opacity: 0.32;
        stroke-width: 1;
      }
      .flight-glow,
      .flight-core {
        stroke-dasharray: 12 100;
        animation: order-flight 2.8s linear infinite;
        animation-delay: var(--flight-delay);
      }
      .flight-glow {
        stroke: #e2c27c;
        stroke-width: 5;
        filter: blur(3px);
      }
      .flight-core {
        stroke: #fff1c9;
        stroke-width: 1.8;
      }
      .map-paused .map-flight path {
        animation-play-state: paused;
      }
      @keyframes order-flight {
        0% {
          stroke-dashoffset: 12;
          opacity: 0;
        }
        12%,
        72% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -100;
          opacity: 0;
        }
      }
      .map-stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-top: 12px;
      }
      .map-heading h2 {
        font-size: 20px;
        letter-spacing: 1px;
        font-weight: 400;
        text-shadow: 0 3px 16px #00000055;
      }
      .map-bottom {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: auto;
      }
      .filter-line {
        margin-top: 12px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
        overflow-wrap: anywhere;
        color: #b5b7ba;
        font-size: 10px;
        pointer-events: auto;
      }
      #range-label {
        flex-basis: 100%;
        margin-bottom: 4px;
      }
      .filter-line button {
        font-size: 10px;
        color: #c8cacc;
        padding: 6px 9px;
      }
      .map-controls {
        gap: 4px;
        padding: 4px;
        border: 1px solid #eef0f31a;
        border-radius: 7px;
        pointer-events: auto;
        background: #c3c6ca15;
        backdrop-filter: blur(18px);
      }
      .map-controls button {
        width: 26px;
        height: 26px;
        border-radius: 5px;
        color: #ccced1;
        font-size: 14px;
      }
      .maplibregl-popup {
        z-index: 11;
        pointer-events: none;
      }
      .maplibregl-popup-content {
        padding: 13px 15px;
        border: 1px solid #d3d6db35;
        border-radius: 12px;
        background: #232528f2;
        color: #e7e8ea;
        box-shadow: 0 14px 36px #0b0c0d80;
        backdrop-filter: blur(18px);
      }
      .maplibregl-popup-tip {
        border-top-color: #232528f2 !important;
        border-bottom-color: #232528f2 !important;
      }
      .map-tooltip strong {
        font-size: 12px;
        font-weight: 500;
      }
      .map-tooltip dl {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 18px;
        margin: 12px 0;
      }
      .map-tooltip dt {
        color: #a9abaf;
        font-size: 9px;
      }
      .map-tooltip dd {
        margin: 3px 0 0;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .map-help {
        margin-left: auto;
        font-size: 9px;
        line-height: 1.7;
        text-align: right;
        color: #a9acb0;
      }
      .map-point {
        --ripple-color: #e2c27c;
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        padding: 0;
        overflow: visible;
        outline: none;
      }
      .map-dot {
        display: block;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background:
          radial-gradient(ellipse at 28% 18%, #fbf3dfd9, transparent 55%),
          linear-gradient(145deg, #e5cc928f, #d8b45c52 62%, #d5b36b7a);
        border: 1px solid #ead6a6e6;
        box-shadow:
          inset 0 1px 2px #faf1dcd9,
          inset 0 -1px 2px #46301138,
          0 2px 5px #00000030,
          0 0 12px #d8b45c4d;
        backdrop-filter: blur(3px) saturate(0.8);
        -webkit-backdrop-filter: blur(3px) saturate(0.8);
        transition:
          width 0.6s,
          height 0.6s,
          background 0.3s;
      }
      .map-point.is-loss .map-dot {
        background:
          radial-gradient(ellipse at 28% 18%, #ffe1dbd9, transparent 55%),
          linear-gradient(145deg, #ff9d9199, #ff786d61 62%, #ffb7ae80);
        border-color: #ffb7aee6;
      }
      .map-point.is-loss {
        --ripple-color: #ff9389;
      }
      .map-point[aria-pressed='true'] .map-dot {
        background:
          radial-gradient(ellipse at 28% 18%, #fff8e6ee, transparent 55%),
          linear-gradient(145deg, #ead4a0b3, #d8b45c70 62%, #ead9b099);
        border-color: var(--accent);
        box-shadow:
          inset 0 1px 2px #ffffffa0,
          inset 0 -1px 2px #30251b55,
          0 0 0 3px #d8b45c20,
          0 0 16px #d8b45c40;
      }
      .map-point.is-loss[aria-pressed='true'] .map-dot {
        background:
          radial-gradient(ellipse at 28% 18%, #ffe1dbee, transparent 55%),
          linear-gradient(145deg, #ff9d91b3, #ff786d70 62%, #ffb7ae99);
        border-color: #ff786d;
        box-shadow:
          inset 0 1px 2px #ffffffa0,
          0 0 0 3px #ff786d25,
          0 0 16px #ff786d40;
      }
      .map-ripple {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.1s ease-out;
      }
      .map-point.is-recent .map-ripple {
        opacity: 1;
        transition-duration: 0.55s;
      }
      .map-ripple:before,
      .map-ripple:after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--size) + 14px);
        height: calc(var(--size) + 14px);
        border: 1.5px solid var(--ripple-color);
        border-radius: 50%;
        box-shadow: 0 0 8px color-mix(in srgb, var(--ripple-color) 40%, transparent);
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -50%);
      }
      .map-point:is(.is-recent, .is-leaving) .map-ripple:before,
      .map-point:is(.is-recent, .is-leaving) .map-ripple:after {
        animation: ripple 3.2s linear infinite;
        animation-delay: var(--delay);
      }
      .map-point:is(.is-recent, .is-leaving) .map-ripple:before {
        animation-delay: calc(var(--delay) - 1.6s);
      }
      .point-label {
        position: absolute;
        left: calc(100% + 9px);
        top: 50%;
        transform: translateY(-50%);
        white-space: nowrap;
        display: none;
        font-size: 10px;
        color: #e0e1e3;
        text-shadow:
          0 2px 5px #151719,

      .map-point.major .point-label,

      /* Request feedback and first paint */
      .notice {
        margin-top: 12px;
        color: #ff9b91;
        background: #383a3ce8;
        backdrop-filter: blur(16px);
        border-radius: 9px;
        padding: 12px 16px;
        font-size: 11px;
        line-height: 1.7;
        pointer-events: auto;
      }
      button:not(.map-point)[aria-busy='true'] {
        position: relative;
        color: transparent !important;
        cursor: progress;
        opacity: 1;
      }
      button:not(.map-point)[aria-busy='true']:after {
        content: '';
        position: absolute;
        width: 12px;
        height: 12px;
        left: calc(50% - 6px);
        top: calc(50% - 6px);
        border: 1.5px solid #d8b45c40;
        border-top-color: var(--accent-soft);
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }
      .panel[data-querying='true']:after {
        content: '';
        position: absolute;
        top: 0;
        left: 14px;
        right: 14px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: query-pulse 1s ease-in-out infinite alternate;
      }
      body:not([data-state='ready']) {
        overflow: hidden;
      }
      body:not([data-state='ready']) main {
        visibility: hidden;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 44%, #393c4088, transparent 60%), #181a1c;
        transition:
          opacity 360ms ease,
          visibility 0s 360ms;
      }
      body[data-state='ready'] .loading {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loading-card {
        width: min(100%, 328px);
        padding: 30px 28px 26px;
        border: 1px solid #d3d6db1c;
        border-radius: 20px;
        background: linear-gradient(145deg, #86888c25, #383b3e33);
        box-shadow:
          inset 0 1px 0 #e6e8ec15,
          0 20px 70px #0b0c0e33;
        text-align: center;
      }
      .loading-orbit {
        width: 36px;
        height: 36px;
        margin: 0 auto 22px;
        border: 1px solid #d8b45c26;
        border-top-color: var(--accent-soft);
        border-right-color: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 24px #d8b45c12;
        animation: loading-spin 1.1s linear infinite;
      }
      .loading-card h2 {
        margin: 10px 0;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 1px;
      }
      #loading-message {
        min-height: 36px;
        font-size: 11px;
        line-height: 1.7;
        color: #aeb1b5;
      }
      .loading-track {
        height: 2px;
        overflow: hidden;
        margin-top: 19px;
        border-radius: 2px;
        background: #ccced217;
      }
      .loading-track:after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent-soft), transparent);
        animation: loading-sweep 1.6s ease-in-out infinite;
      }
      #loading-retry {
        margin-top: 16px;
        padding: 8px 16px;
        border: 1px solid var(--accent-line);
        border-radius: 7px;
        color: var(--accent-soft);
        background: var(--accent-glow);
        font-size: 11px;
      }
      body[data-state='error'] .loading-track {
        visibility: hidden;
      }
      body[data-state='error'] .loading-orbit {
        animation: none;
        border-color: #ff9b9155;
      }
      body[data-state='ready'] header,
      body[data-state='ready'] footer,
      body[data-state='ready'] .map-stage > * {
        animation: appear 700ms cubic-bezier(0.22, 0.68, 0, 1) both;
      }
      /* One flip sequence; direction varies by card position. */
      body[data-state='ready'] .panel {
        --reveal-duration: 1600ms;
        --reveal-from: rotateX(82deg);
        transform-origin: center bottom;
        animation: card-flip var(--reveal-duration) cubic-bezier(0.2, 0.65, 0.25, 1) backwards;
        /* Start after loading fades, then wait for each preceding card. */
        animation-delay: calc(380ms + var(--reveal-order, 0) * var(--reveal-duration));
      }
      body[data-state='ready'] .hero {
        --reveal-from: rotateY(-82deg);
        transform-origin: left center;
      }
      .grid > .panel {
        --reveal-order: 1;
      }
      .grid > :nth-child(2) {
        --reveal-order: 2;
      }
      .grid > :nth-child(3) {
        --reveal-order: 3;
      }
      @keyframes card-flip {
        from {
          opacity: 0;
          transform: perspective(1400px) var(--reveal-from);
        }
        15% {
          opacity: 1;
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes appear {
        from {
          opacity: 0;
          translate: 0 8px;
        }
        to {
          opacity: 1;
          translate: 0 0;
        }
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes loading-sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(360%);
        }
      }
      @keyframes query-pulse {
        from {
          opacity: 0.25;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ripple {
        0% {
          transform: translate(-50%, -50%) scale(0.7);
          opacity: 0;
        }
        12% {
          opacity: 0.9;
        }
        52% {
          opacity: 0.55;
        }
        100% {
          transform: translate(-50%, -50%) scale(2.5);
          opacity: 0;
        }
      }

      /* One analysis workspace, native charts and virtualized tables. */
      .more-control {
        position: relative;
      }
      .more-button {
        display: grid;
        place-items: center;
        padding: 0;
        border-color: transparent;
        background: transparent;
        color: var(--accent-soft);
      }
      .more-button svg {
        width: 18px;
        height: 18px;
      }

        animation: more-glow 4.8s ease-in-out infinite;
      }
      .more-button:hover,
      .more-button:focus-visible,
      .more-button[aria-expanded='true'] {
        animation: none;
        border-color: var(--accent-line);
        background: var(--accent-glow);
        color: #f1f3f5;
      }
      @keyframes more-glow {
        0%,
        70%,
        100% {
          border-color: transparent;
          background: transparent;
          box-shadow: 0 0 0 0 #d8b45c00;
          color: var(--accent-soft);
        }
        35% {
          border-color: #d8b45c80;
          background: #d8b45c2b;
          box-shadow:
            0 0 0 4px #d8b45c18,
            0 0 16px #d8b45c38;
          color: #f4e7c4;
        }
      }
      #more-menu {
        --glass-tint: #1d1f21d9;
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        width: 220px;
        padding: 6px;
        border-radius: 12px;
      }
      #more-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 11px 12px;
        border-radius: 7px;
        font-size: 12px;
      }
      #more-menu button:hover {
        background: var(--accent-glow);
      }
      #more-menu small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
      }
      dialog {
        --glass-tint: #212326bc;
        color: #e6e8ea;
        border-radius: 18px;
        padding: 0;
        width: min(1560px, calc(100vw - 40px));
        height: min(90dvh, 1000px);
        max-width: none;
        max-height: none;
        box-shadow: 0 30px 100px #0008;
        overflow: hidden;
      }
      dialog[open] {
        display: flex;
        flex-direction: column;
      }
      dialog::backdrop {
        background: #0b0c0e7d;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }
      .dialog-head,
      .dialog-foot {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 22px;
        flex-shrink: 0;
      }
      .dialog-head h2 {
        font-size: 18px;
        letter-spacing: 0.5px;
      }
      .dialog-head .icon-button {
        margin-left: auto;
      }
      .dialog-scope {
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      #analysis-nav {
        padding: 0 22px 12px;
        border-bottom: 1px solid var(--line);
        gap: 6px;
        flex-shrink: 0;
      }
      #analysis-nav button {
        font-size: 12px;
        padding: 7px 12px;
      }
      .analysis-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 22px;
        justify-content: flex-end;
      }
      #analysis-back {
        margin-right: auto;
      }
      .analysis-toolbar .table-action {
        margin-left: 0;
      }
      .analysis-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 0 22px 14px;
      }
      .analysis-metrics .kpi {
        min-width: 0;
        padding: 12px 14px;
      }
      .analysis-metrics strong {
        font-size: clamp(19px, 2vw, 27px);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .analysis-metrics small {
        margin-left: 4px;
        font-size: 10px;
        color: var(--muted);
      }
      .analysis-body {
        display: grid;
        grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.3fr);
        gap: 14px;
        padding: 0 22px;
        min-height: 0;
        flex: 1;
      }
      .analysis-body[data-full='true'] {
        grid-template-columns: 1fr;
      }
      .analysis-surface {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid #e9ebee0c;
        border-radius: 10px;
        background: linear-gradient(145deg, #13151722, #23262912);
        box-shadow: inset 0 1px 8px #10111314;
      }
      .analysis-surface h3 {
        font-size: 12px;
        font-weight: 400;
        padding: 14px 16px 6px;
        color: #bbbec2;
      }
      #analysis-chart,
      #analysis-table {
        flex: 1;
        min-height: 0;
        min-width: 0;
      }
      #analysis-dialog[aria-busy='true'] .analysis-body,
      #analysis-dialog[aria-busy='true'] .analysis-metrics {
        opacity: 0.35;
        pointer-events: none;
      }
      .dialog-foot {
        font-size: 11px;
        color: var(--muted);
        min-height: 48px;
        flex-wrap: wrap;
      }
      #analysis-table[data-empty='true'] {
        display: grid;
        place-items: center;
      }
      #analysis-table[data-empty='true']:after {
        content: '当前范围暂无数据';
        color: var(--muted);
        font-size: 12px;
      }
      #analysis-count {
        margin-left: auto;
      }
      #analysis-message[data-error='true'] {
        color: #ff786d;
      }
      @media (min-width: 1200px) {
        header {
          position: absolute;
          right: var(--gutter);
          top: var(--space);
          z-index: 5;
          max-width: calc(100% - 390px);
        }
        .map-top {
          padding-top: 42px;
        }
      }
      @media (max-width: 900px) {
        .analysis-body {
          grid-template-columns: 1fr;
          grid-template-rows: 280px minmax(320px, 1fr);
          overflow-y: auto;
          flex: 1;
        }
        .analysis-body[data-full='true'] {
          grid-template-rows: minmax(320px, 1fr);
        }
        .analysis-metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .analysis-metrics .kpi {
          padding: 8px 10px;
        }
        .analysis-metrics strong {
          font-size: 20px;
        }
        dialog {
          height: 96dvh;
        }
      }

      /* Narrow layouts grow with content; desktop height never depends on table rows. */
      @media (min-width: 1700px) {
        .stage {
          grid-template-columns: 370px minmax(0, 1fr);
        }
      }
      @media (max-height: 800px) and (min-width: 1200px) {
        :root {
          --space: 10px;
        }
        main {
          grid-template-rows: minmax(0, 1.9fr) minmax(0, 1fr) auto;
        }
        .hero {
          gap: 5px;
        }
        .hero .panel-head {
          min-height: 20px;
        }
        .kpi {
          padding: clamp(4px, calc(3dvh - 15.5px), 6px) 6px;
        }
        .kpi p {
          margin-bottom: 3px;
        }
        .comparisons {
          margin-top: 4px;
          line-height: 1.3;
        }
        .revenue-card {
          padding: 8px;
        }
      }
      @media (max-width: 1199px) {
        body {
          height: auto;
          overflow-x: clip;
          overflow-y: auto;
        }
        main {
          height: auto;
          min-height: 100dvh;
          grid-template-rows: auto;
        }
        .stage {
          grid-template-columns: 292px minmax(0, 1fr);
        }
        .hero {
          overflow: visible;
        }
        .map-stage {
          min-height: 370px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-auto-rows: minmax(290px, auto);
        }
        .stream {
          grid-column: 1 / -1;
        }
        .table-wrap {
          height: 232px;
          flex: auto;
        }
      }
      @media (max-width: 700px) {
        :root {
          --gutter: 12px;
          --space: 12px;
          --primary: 32px;
          --secondary: 24px;
        }
        .controls {
          width: 100%;
          gap: 6px;
        }
        .segments {
          flex: 1;
        }
        .segments button {
          padding: 6px 8px;
          flex: 1;
        }
        .live {
          display: none;
        }
        .stage {
          display: flex;
          flex-direction: column;
        }
        .kpi-grid {
          grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
        }
        .map-stage {
          order: -1;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        #map,
        #map .maplibregl-canvas-container::after {
          position: absolute;
          bottom: auto;
          height: var(--map-height, 600px);
        }
        #map .maplibregl-canvas-container::after {
          background: linear-gradient(180deg, #17181add, transparent 30%, #181a1c);
        }
        .map-point.major .point-label {
          display: none;
        }
        .map-point:hover .point-label,
        .map-point[aria-pressed='true'] .point-label {
          display: block;
        }
        dialog {
          width: calc(100vw - 16px);
        }
        .dialog-head,
        .dialog-foot {
          padding: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

      function deriveSupermarketMetrics(summary = {}, loss = {}, discounted = {}) {

          orders,

          average: ratio(sales, orders),
          basket: ratio(units, orders),
          margin: percent(profit, sales),
          discountShare: percent(number(discounted.sales), sales),

            : provinces.flatMap((row) => {
                const coordinates = row.country_or_region === '中国' && positions[supermarketProvinceName(row.province)]

      async function queryGroupedDataset(VBI, VQuery, records, configure, signal) {

            discoverSchema: async () => schema,

      // Calendar operations use Beijing wall time represented as UTC, independent of browser timezone.
      function supermarketRanges(period, stamp) {
        const now = new Date(stamp.replace(' ', 'T').slice(0, 19) + 'Z')
        const format = (d) => d.toISOString().slice(0, 19).replace('T', ' ')
        const days = (d, n) => new Date(d.valueOf() + n * 86400000)
        const months = (d, n) => {
          const result = new Date(d)
          const day = result.getUTCDate()
          result.setUTCDate(1)
          result.setUTCMonth(result.getUTCMonth() + n)
          const last = new Date(Date.UTC(result.getUTCFullYear(), result.getUTCMonth() + 1, 0)).getUTCDate()
          result.setUTCDate(Math.min(day, last))
          return result
        }
        const rolling = { days7: 7, days14: 14, days30: 30 }[period]
        const start = new Date(now)
        start.setUTCHours(0, 0, 0, 0)
        if (rolling) start.setUTCDate(start.getUTCDate() - rolling + 1)
        if (period === 'week') start.setUTCDate(start.getUTCDate() - ((start.getUTCDay() + 6) % 7))
        if (['month', 'quarter', 'year'].includes(period)) start.setUTCDate(1)
        if (period === 'quarter') start.setUTCMonth(Math.floor(start.getUTCMonth() / 3) * 3)
        if (period === 'year') start.setUTCMonth(0)
        const shift = (d) =>
          rolling
            ? days(d, -rolling)
            : period === 'today'
              ? days(d, -1)
              : period === 'week'
                ? days(d, -7)
                : months(d, period === 'month' ? -1 : period === 'quarter' ? -3 : -12)
        const yearShift = (d) => (period === 'week' ? days(d, -364) : months(d, -12))
        // Day-based charts compare the same elapsed duration, capped at the baseline period end.
        // This keeps quarter/month totals consistent with ordinal day alignment even across short months.
        const periodEnd = (d) =>
          rolling
            ? days(d, rolling)
            : period === 'today'
              ? days(d, 1)
              : period === 'week'
                ? days(d, 7)
                : months(d, period === 'month' ? 1 : period === 'quarter' ? 3 : 12)
        const baselineEnd = (from, calendarEnd) =>
          period === 'year'
            ? calendarEnd
            : new Date(Math.min(from.valueOf() + now.valueOf() - start.valueOf(), periodEnd(from).valueOf()))
        const range = (from, to) => ({ start: format(from), end: format(to) })
        return {
          current: range(start, now),
          previous: range(shift(start), baselineEnd(shift(start), shift(now))),
          year: range(yearShift(start), baselineEnd(yearShift(start), yearShift(now))),

          const lookup = (chart, value) => {

          const sources = [lookup(trend, seed), lookup(previousTrend, prior), lookup(yearTrend, year)]

              }
          }
          if (!config.hierarchy)
            styleAxes(spec, (text, orient) => {
              if (orient !== 'left') return text
              const label = String(chartNames.get(text) || text)
              return label.length > 13 ? label.slice(0, 13) + '…' : label
            })
          return spec
        }
        function openRecordDetails(record) {
          if (!record || analysisBusy || !analysisDialog.open) return
          const ids = queryFieldIds(analysisModules[analysisKey].builder),
            scope = { ...analysisScope }
          const mapping = {
            product_type: 'category',
            product_sub_type: 'product_sub_type',
            product_id: 'product',
            customer_id: 'customer_id',
            country_or_region: 'country_or_region',
            area: 'area',
            province: 'province',
            city: 'city',
          }
          for (const [field, target] of Object.entries(mapping))
            if (ids[field] && record[ids[field]]) scope[target] = record[ids[field]]
          drillOrigin = { key: analysisKey, scope: analysisScope }
          openAnalysis('details', $('#analysis-table'), scope)
        }
        $('#analysis-back').onclick = () => {
          const origin = drillOrigin
          drillOrigin = null
          if (origin) openAnalysis(origin.key, $('#analysis-back'), origin.scope)
        }
        $('#analysis-refresh').onclick = () => {
          analysisScope.range = currentRanges().current
          analysisBaseScope.range = analysisScope.range
          if (drillOrigin) drillOrigin.scope.range = analysisScope.range
          $('#analysis-scope').textContent = scopeText(analysisScope)
          loadAnalysis($('#analysis-refresh'))
        }
        $('#analysis-retry').onclick = () => loadAnalysis($('#analysis-retry'))
        $('#close-analysis').onclick = () => analysisDialog.close()
        analysisDialog.addEventListener('close', () => {
          analysisController?.abort()
          document
            .querySelectorAll('#analysis-dialog [aria-busy], [data-analysis], #expand-details')
            .forEach((element) => element.setAttribute('aria-busy', 'false'))
          analysisBusy = false
          analysisController = null
          clearAnalysis()
        })
        document
          .querySelectorAll('[data-open-analysis]')
          .forEach((button) => (button.onclick = () => openAnalysis(button.dataset.openAnalysis, button)))
        $('#expand-details').onclick = () =>
          openAnalysis('details', $('#expand-details'), {
            range: currentRanges().current,
            province,
            city,
            product: detailsProduct,
            lossOnly,
          })
        await refresh()
      } catch (error) {
        fail(error.message)
        $('#live-label').textContent = '连接失败'
        $('#refresh').disabled = false
        $('#refresh').onclick = () => location.reload()
      }
      motion.addEventListener('change', () => {
        trendRenderKey = productsRenderKey = undefined
        renderMapMarkers()
        if (!motion.matches) return
        mapMarkers.forEach(({ el }) => el.classList.remove('is-leaving'))
        animations.forEach((a) => a.finish())
        instances.forEach((instance) => {
          instance.stopAnimation()
          instance.updateSpecSync({ ...instance.getSpec(), animation: false })
        })
      })
    </script>
  </body>
</html>
