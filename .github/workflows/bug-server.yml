name: Bug Server CI

# 这里业务方根据需求设置
on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/vseed/**'
  push:
    branches: ['main']
    paths:
      - 'packages/vseed/**'

env:
  CI: true
  HUSKY: 0

permissions:
  contents: read

jobs:
  gray-scope:
    # 事件已由 packages/vseed/** 路径过滤；无权限、不检出仓库，只按可信元数据交接。
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
          CREATED_AT: ${{ github.event.pull_request.created_at }}
          REPOSITORY: ${{ github.repository }}
          INTERNAL_SINCE: ${{ vars.VISACTOR_WORKFLOW_INTERNAL_SINCE }}
        run: |
          # 仅交接目标 main；其他分支保留旧 Photo，新 Draft 等待 ready。
          skip=$(python3 - <<'PY'
          import os, re
          from datetime import datetime
          e = os.environ
          skip = False
          if (e['EVENT_NAME'] == 'pull_request' and e['REPOSITORY'] == 'VisActor/VBI'
              and e['HEAD_REPOSITORY'] == e['BASE_REPOSITORY'] == e['REPOSITORY']
              and e['BASE_REF'] == 'main' and e['INTERNAL_SINCE']):
              # 已配置交接却缺失可信元数据时停止旧构建，避免两套 Photo 同时执行。
              since = e['INTERNAL_SINCE']
              if not re.fullmatch(r'[1-9][0-9]{0,15}', since) or int(since) > 8640000000000000:
                  raise SystemExit('Invalid VISACTOR_WORKFLOW_INTERNAL_SINCE')
              if e['BASE_REPOSITORY_ID'] != '1028346413' or e['HEAD_REPOSITORY_ID'] != e['BASE_REPOSITORY_ID']:
                  raise SystemExit('Invalid internal repository identity')
              created = e['CREATED_AT']
              if not re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z', created):
                  raise SystemExit('Invalid PR creation time')
              skip = int(datetime.fromisoformat(created.replace('Z', '+00:00')).timestamp() * 1000) > int(since)
          print('true' if skip else 'false')
          PY
          )
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: gray-scope
    if: needs.gray-scope.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c # v4.2.0
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Print All Github Environment Variables
        run: env

      - name: Build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: pnpm --filter '!website' build

      - name: Run CI
        working-directory: ./tools/bugserver-trigger
        env:
          BUG_SERVER_TOKEN: ${{ secrets.BUG_SERVER_TOKEN }}
        run: pnpm run ci
